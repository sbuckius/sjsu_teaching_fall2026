/* ============================================================
   10c. PHASE THREE: DECIDING
   ============================================================ */
const METHODS = [
  ["dots",       "dot vote",      "Everyone gets the same handful of dots and spends them however they like, stacking allowed. Turn on blind to hide the tallies until the reveal, so nobody follows the first vote."],
  ["ranked",     "ranked points", "Each person names a first, second and third choice, worth three, two and one. Spreads the result out more than dots and finds the strong second favourite."],
  ["grid",       "two axis grid", "Drag every idea onto the plane. Name the axes yourselves. Where an idea sits is the judgement, and the arguments happen while you place it."],
  ["criteria",   "criteria score","Name up to three things you are judging by, then score each idea one to five on each. Slower, but it forces the group to say what it actually values."],
  ["consent",    "consent check", "Mark every idea love it, live with it, or block it. A block is not a veto, it is a request to talk. Finds the idea everyone can live with rather than the loudest favourite."],
  ["stress",     "stress test",   "Every idea needs a written answer to what would break this before it can advance. An idea nobody can find a flaw in is usually one nobody has thought about hard enough."],
  ["constraint", "constraint",    "Write one constraint, then mark what survives it. Failing ideas grey out rather than disappear, so you can lift the constraint and watch them come back."],
  ["bracket",    "head to head",  "Two ideas at a time, pick one, the winner advances. It makes the group defend one comparison at a time. The one method here that needs everyone at once, since whoever opens it first can run the whole bracket alone."]
];
const DEFAULT_SETTINGS = {
  method:"dots", dots:5, blind:true, revealed:false, anon:false, quota:0,
  ax:{n:"strange", s:"safe", w:"hard to make", e:"easy to make"},
  crit:["makes me curious","we could actually do it","nobody expects it"],
  constraint:"", bracket:null
};
const S = () => Object.assign({}, DEFAULT_SETTINGS, state.settings || {});
function patchSettings(patch){
  state.settings = Object.assign(S(), patch);
  if(state.live) groupRef.child("settings").update(patch);
  else render();
}
const deck = () => Object.values(state.cards)
  .filter(c => c.zone === "stage")
  .sort((a,b) => a.ts - b.ts);
const alive = () => deck().filter(c => !c.cut);
const nameOf = c => S().anon ? "" : c.authorName;
const sumVotes = c => Object.values(c.votes || {}).reduce((a,b) => a + b, 0);
const myVotes = c => (c.votes || {})[state.me.id] || 0;
const spentVotes = () => deck().reduce((a,c) => a + myVotes(c), 0);
const rankPoints = c => Object.values(c.ranks || {}).reduce((a,r) => a + (4 - r), 0);
const critTotal = c => (c.scores || []).reduce((a,b) => a + (b || 0), 0);
const consentCount = c => {
  const v = Object.values(c.consent || {});
  return {love:v.filter(x => x === "love").length, live:v.filter(x => x === "live").length, block:v.filter(x => x === "block").length};
};
function score(c, m){
  if(m === "dots") return sumVotes(c);
  if(m === "ranked") return rankPoints(c);
  if(m === "criteria") return critTotal(c);
  if(m === "consent"){ const k = consentCount(c); return k.love * 2 + k.live - k.block * 3; }
  return 0;
}
const hidden = () => S().blind && !S().revealed;

function renderDecide(){
  renderValues($("#valuesDecide"));
  const s = S(), m = s.method;
  const mb = $("#methods");
  mb.innerHTML = "";
  METHODS.forEach(([id, label]) => {
    const b = document.createElement("button");
    b.textContent = label;
    b.dataset.on = m === id ? "1" : "0";
    b.onclick = () => patchSettings({method:id, revealed:false});
    mb.appendChild(b);
  });

  const o = $("#opts");
  o.innerHTML = "";
  const blurb = document.createElement("div");
  blurb.className = "blurb";
  blurb.textContent = METHODS.find(x => x[0] === m)[2];
  o.appendChild(blurb);

  const add = el => o.appendChild(el);
  const btn = (label, on, fn) => {
    const b = document.createElement("button");
    b.textContent = label; if(on) b.className = "on"; b.onclick = fn; return b;
  };
  const field = (label, value, type, fn, w) => {
    const d = document.createElement("div");
    d.className = "field";
    d.innerHTML = `<span>${label}</span>`;
    const i = document.createElement("input");
    i.type = type; i.value = value; if(w) i.style.width = w;
    i.onchange = () => fn(type === "number" ? +i.value : i.value);
    d.appendChild(i); return d;
  };

  if(m === "dots"){
    add(field("dots each", s.dots, "number", v => patchSettings({dots: Math.max(1, v)})));
    const left = Math.max(0, s.dots - spentVotes());
    const live = document.createElement("span");
    live.className = "live";
    live.innerHTML = `you have <b>${pad(left)}</b> left`;
    add(live);
  }
  if(m === "criteria"){
    s.crit.forEach((c, i) => add(field("0" + (i+1), c, "text", v => {
      const next = s.crit.slice(); next[i] = v; patchSettings({crit: next});
    })));
  }
  if(m === "constraint"){
    add(field("it has to", s.constraint, "text", v => patchSettings({constraint: v}), "300px"));
  }
  if(m === "bracket"){
    add(btn("start over", false, () => startBracket()));
  }
  const p = document.createElement("div"); p.className = "push"; add(p);

  if(["dots","ranked","criteria","consent"].includes(m)){
    add(btn(s.blind ? "blind: on" : "blind: off", s.blind, () => patchSettings({blind: !s.blind, revealed:false})));
    if(s.blind) add(btn(s.revealed ? "hide again" : "reveal", s.revealed, () => patchSettings({revealed: !s.revealed})));
  }
  add(btn(s.anon ? "names: hidden" : "names: shown", s.anon, () => patchSettings({anon: !s.anon})));
  add(field("keep", s.quota, "number", v => patchSettings({quota: Math.max(0, v)})));
  const tally = document.createElement("span");
  tally.className = "live";
  const n = alive().length;
  tally.innerHTML = s.quota
    ? `<b>${pad(n)}</b> in play, cut ${pad(Math.max(0, n - s.quota))} more`
    : `<b>${pad(n)}</b> in play`;
  add(tally);

  const board = $("#decideBoard");
  board.innerHTML = "";
  if(m === "grid") return renderPlane(board);
  if(m === "bracket") return renderBracket(board);

  const wrap = document.createElement("div");
  wrap.className = "deck";
  let cards = deck();
  if(["dots","ranked","criteria","consent"].includes(m) && !hidden()){
    cards = cards.slice().sort((a,b) => score(b,m) - score(a,m));
  }
  const top = cards.length ? score(cards[0], m) : 0;
  cards.forEach(c => wrap.appendChild(decideCardEl(c, m, top)));
  if(!cards.length) wrap.innerHTML = `<div class="pane-empty">Nothing in the frame yet. Riff first.</div>`;
  board.appendChild(wrap);
}

function decideCardEl(c, m, top){
  const s = S();
  const el = document.createElement("div");
  el.className = "dcard" + (isFresh(c) ? " fresh" : "") + (c.cut ? " cut" : "");
  el.style.setProperty("--c", c.color);
  const k = consentCount(c);
  if(m === "consent" && k.block) el.classList.add("blocked");
  if(!hidden() && top && score(c, m) === top && score(c, m) > 0 && !c.cut) el.classList.add("lead");

  const meta = document.createElement("div");
  meta.className = "meta";
  meta.innerHTML = `<span class="who">${esc(nameOf(c))}</span>`;
  const cut = document.createElement("button");
  cut.className = "cut";
  cut.textContent = c.cut ? "bring back" : "cut";
  cut.onclick = () => { patchCard(c.id, {cut: !c.cut}); renderDecide(); };
  meta.appendChild(cut);
  el.appendChild(meta);

  if(c.img){ const im = document.createElement("img"); im.src = c.img; el.appendChild(im); }
  const t = document.createElement("div");
  t.className = "txt"; t.textContent = c.text || "[image]";
  el.appendChild(t);
  if(c.combined){
    const src = document.createElement("div");
    src.className = "src";
    src.innerHTML = c.combined.map(x => `<div>${esc(x)}</div>`).join("");
    el.appendChild(src);
  }

  const ctl = document.createElement("div");
  ctl.className = "ctl";
  const B = (label, on, fn, warn) => {
    const b = document.createElement("button");
    b.textContent = label;
    b.className = (on ? "on " : "") + (warn ? "warn" : "");
    b.onclick = fn; return b;
  };
  const scoreEl = () => {
    const sp = document.createElement("span");
    if(hidden()){ sp.className = "veil-score"; sp.textContent = "hidden"; }
    else { sp.className = "score"; sp.textContent = pad(score(c, m)); }
    return sp;
  };

  if(m === "dots"){
    const mine = myVotes(c), left = s.dots - spentVotes();
    ctl.appendChild(B("−", false, () => {
      if(mine <= 0) return;
      const v = Object.assign({}, c.votes); v[state.me.id] = mine - 1;
      if(!v[state.me.id]) delete v[state.me.id];
      patchCard(c.id, {votes: v}); renderDecide();
    }));
    const lab = document.createElement("span");
    lab.className = "lab"; lab.textContent = "you " + mine;
    ctl.appendChild(lab);
    ctl.appendChild(B("+", false, () => {
      if(left <= 0){ toast("you have spent all your dots"); return; }
      const v = Object.assign({}, c.votes); v[state.me.id] = mine + 1;
      patchCard(c.id, {votes: v}); renderDecide();
    }));
    if(!hidden()){
      const bar = document.createElement("div");
      bar.className = "tallybar";
      bar.innerHTML = "<span class='dot'></span>".repeat(Math.min(sumVotes(c), 24));
      ctl.appendChild(bar);
    }
    ctl.appendChild(scoreEl());
  }

  if(m === "ranked"){
    [1,2,3].forEach(r => {
      const on = (c.ranks || {})[state.me.id] === r;
      ctl.appendChild(B(["first","second","third"][r-1], on, () => {
        deck().forEach(o => {
          const rr = (o.ranks || {})[state.me.id];
          if(rr === r && o.id !== c.id){
            const cp = Object.assign({}, o.ranks); delete cp[state.me.id];
            patchCard(o.id, {ranks: cp});
          }
        });
        const mineR = Object.assign({}, c.ranks);
        if(on) delete mineR[state.me.id]; else mineR[state.me.id] = r;
        patchCard(c.id, {ranks: mineR});
        renderDecide();
      }));
    });
    ctl.appendChild(scoreEl());
  }

  if(m === "criteria"){
    ctl.style.flexDirection = "column";
    ctl.style.alignItems = "stretch";
    s.crit.forEach((nm, i) => {
      const row = document.createElement("div");
      row.className = "crit";
      row.innerHTML = `<span class="nm">${esc(nm)}</span>`;
      for(let v = 1; v <= 5; v++){
        const pip = document.createElement("button");
        pip.className = "pip" + (((c.scores || [])[i] || 0) >= v ? " on" : "");
        pip.onclick = () => {
          const sc = (c.scores || [0,0,0]).slice();
          sc[i] = sc[i] === v ? 0 : v;
          patchCard(c.id, {scores: sc}); renderDecide();
        };
        row.appendChild(pip);
      }
      ctl.appendChild(row);
    });
    const foot = document.createElement("div");
    foot.style.cssText = "display:flex;align-items:center";
    foot.appendChild(scoreEl());
    ctl.appendChild(foot);
  }

  if(m === "consent"){
    const mine = (c.consent || {})[state.me.id];
    [["love it","love"],["live with it","live"],["block","block"]].forEach(([label, val]) => {
      ctl.appendChild(B(label, mine === val, () => {
        const cs = Object.assign({}, c.consent);
        if(mine === val) delete cs[state.me.id]; else cs[state.me.id] = val;
        patchCard(c.id, {consent: cs}); renderDecide();
      }, val === "block"));
    });
    if(!hidden()){
      const lab = document.createElement("span");
      lab.className = "lab";
      lab.textContent = `${k.love} love · ${k.live} live · ${k.block} block`;
      ctl.appendChild(lab);
    }
  }

  if(m === "stress"){
    ctl.style.flexDirection = "column";
    ctl.style.alignItems = "stretch";
    const ta = document.createElement("textarea");
    ta.className = "note";
    ta.placeholder = "what would break this?";
    ta.value = c.stress || "";
    ta.onchange = () => patchCard(c.id, {stress: ta.value.trim(), stressBy: state.me.name});
    ctl.appendChild(ta);
    const lab = document.createElement("span");
    lab.className = "lab";
    lab.textContent = c.stress ? "tested" + (c.stressBy && !s.anon ? " by " + c.stressBy : "") : "untested";
    ctl.appendChild(lab);
  }

  if(m === "constraint"){
    ctl.appendChild(B("survives", c.fails === false, () => { patchCard(c.id, {fails: false}); renderDecide(); }));
    ctl.appendChild(B("fails", c.fails === true, () => { patchCard(c.id, {fails: true}); renderDecide(); }, true));
    if(c.fails === true) el.style.opacity = ".38";
  }

  el.appendChild(ctl);
  return el;
}

/* ---------- two axis plane ---------- */
function renderPlane(board){
  const s = S();
  const wrap = document.createElement("div");
  wrap.className = "plane-wrap";

  const side = document.createElement("div");
  side.className = "tostage";
  side.innerHTML = `<div class="pane-head"><span class="tag">not placed</span></div>`;
  const sideBody = document.createElement("div");
  sideBody.className = "pane-body";
  sideBody.id = "planePool";
  side.appendChild(sideBody);

  const plane = document.createElement("div");
  plane.className = "plane";
  plane.id = "plane";
  [["n","n"],["s","s"],["w","w"],["e","e"]].forEach(([k]) => {
    const a = document.createElement("div");
    a.className = "axis " + k;
    const i = document.createElement("input");
    i.value = s.ax[k];
    i.onchange = () => patchSettings({ax: Object.assign({}, s.ax, {[k]: i.value})});
    a.appendChild(i);
    plane.appendChild(a);
  });

  wrap.append(side, plane);
  board.appendChild(wrap);

  const pr = plane.getBoundingClientRect();
  deck().forEach(c => {
    if(c.gx == null){
      const chip = document.createElement("div");
      chip.className = "pin" + (c.cut ? " cut" : "");
      chip.style.cssText = "position:static;width:auto;box-shadow:none";
      chip.style.setProperty("--c", c.color);
      chip.innerHTML = `${esc(c.text || "[image]")}<span class="who">${esc(nameOf(c))}</span>`;
      dragPin(chip, c, plane);
      sideBody.appendChild(chip);
    }else{
      const pin = document.createElement("div");
      pin.className = "pin" + (c.cut ? " cut" : "");
      pin.style.setProperty("--c", c.color);
      pin.style.left = Math.round(c.gx * pr.width) + "px";
      pin.style.top = Math.round(c.gy * pr.height) + "px";
      pin.innerHTML = `${esc(c.text || "[image]")}<span class="who">${esc(nameOf(c))}</span>`;
      dragPin(pin, c, plane);
      plane.appendChild(pin);
    }
  });
  if(!sideBody.children.length) sideBody.innerHTML = `<div class="pane-empty">Everything is placed.</div>`;
}

function dragPin(el, card, plane){
  el.addEventListener("pointerdown", e => {
    e.preventDefault();
    const box = el.getBoundingClientRect();
    const offX = e.clientX - box.left, offY = e.clientY - box.top;
    const ghost = el.cloneNode(true);
    ghost.className = "pin ghost";
    ghost.style.cssText = `position:fixed;width:150px;left:${box.left}px;top:${box.top}px`;
    ghost.style.setProperty("--c", card.color);
    document.body.appendChild(ghost);
    el.style.opacity = ".2";
    const move = ev => {
      ghost.style.left = (ev.clientX - offX) + "px";
      ghost.style.top = (ev.clientY - offY) + "px";
    };
    const up = ev => {
      document.removeEventListener("pointermove", move);
      document.removeEventListener("pointerup", up);
      ghost.remove();
      el.style.opacity = "";
      const r = plane.getBoundingClientRect();
      const inside = ev.clientX > r.left && ev.clientX < r.right && ev.clientY > r.top && ev.clientY < r.bottom;
      if(inside){
        patchCard(card.id, {
          gx: clamp((ev.clientX - offX - r.left) / r.width, 0, 1 - 150 / r.width),
          gy: clamp((ev.clientY - offY - r.top) / r.height, 0, .93)
        });
      }else if(document.elementFromPoint(ev.clientX, ev.clientY)?.closest("#planePool")){
        patchCard(card.id, {gx: null, gy: null});
      }
      renderDecide();
    };
    document.addEventListener("pointermove", move);
    document.addEventListener("pointerup", up);
  });
}

/* ---------- head to head ---------- */
function startBracket(){
  const ids = alive().map(c => c.id);
  for(let i = ids.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [ids[i], ids[j]] = [ids[j], ids[i]];
  }
  patchSettings({bracket: {ids, i: 0, round: 1, winners: [], champ: null}});
}
function renderBracket(board){
  const s = S();
  const b = s.bracket;
  const wrap = document.createElement("div");
  wrap.className = "bracket";
  if(!b || !b.ids || b.ids.length < 2){
    wrap.innerHTML = `<div class="note">${alive().length < 2 ? "you need at least two ideas in play" : "ready when you are"}</div>`;
    const go = document.createElement("button");
    go.className = "phasebtn";
    go.textContent = "start the bracket";
    go.onclick = startBracket;
    if(alive().length >= 2) wrap.appendChild(go);
    board.appendChild(wrap); return;
  }
  if(b.champ){
    const c = state.cards[b.champ];
    wrap.innerHTML = `<div class="champ">
      <div class="note">last one standing</div>
      <div class="big">${esc(c ? c.text : "gone")}</div>
      <div class="note" style="margin-top:12px">${esc(c ? nameOf(c) : "")}</div></div>`;
    const again = document.createElement("button");
    again.className = "phasebtn"; again.textContent = "run it again";
    again.onclick = startBracket;
    wrap.appendChild(again);
    board.appendChild(wrap); return;
  }
  const a = state.cards[b.ids[b.i]], d = state.cards[b.ids[b.i + 1]];
  if(!a || !d){ advanceBracket(b.ids[b.i] ? b.ids[b.i] : null); return; }
  const head = document.createElement("div");
  head.className = "note";
  head.textContent = `round ${pad(b.round)} · match ${pad(b.i / 2 + 1)} of ${pad(Math.floor(b.ids.length / 2))}`;
  const vs = document.createElement("div");
  vs.className = "vs";
  [a, d].forEach((c, idx) => {
    const f = document.createElement("div");
    f.className = "fighter";
    f.style.setProperty("--c", c.color);
    f.innerHTML = (c.img ? `<img src="${c.img}">` : "") +
      `<div class="t">${esc(c.text || "[image]")}</div><div class="w">${esc(nameOf(c))}</div>`;
    const pick = document.createElement("button");
    pick.className = "phasebtn"; pick.textContent = "this one";
    pick.onclick = () => advanceBracket(c.id);
    f.appendChild(pick);
    vs.appendChild(f);
    if(idx === 0){ const m = document.createElement("div"); m.className = "mid"; m.textContent = "or"; vs.appendChild(m); }
  });
  wrap.append(head, vs);
  board.appendChild(wrap);
}
function advanceBracket(winner){
  const b = Object.assign({}, S().bracket);
  if(!b || !b.ids) return;
  b.winners = (b.winners || []).concat(winner ? [winner] : []);
  b.i += 2;
  if(b.i >= b.ids.length){
    if(b.ids.length % 2 === 1) b.winners.push(b.ids[b.ids.length - 1]);
    if(b.winners.length <= 1){ b.champ = b.winners[0] || null; }
    else { b.ids = b.winners; b.winners = []; b.i = 0; b.round++; }
  }
  patchSettings({bracket: b});
}

function decideText(){
  const s = S(), m = s.method;
  const label = METHODS.find(x => x[0] === m)[1];
  const cards = deck().slice().sort((a, b) => score(b, m) - score(a, m));
  const line = c => {
    const bits = [];
    if(m === "dots") bits.push(`${pad(sumVotes(c))} dots`);
    if(m === "ranked") bits.push(`${pad(rankPoints(c))} pts`);
    if(m === "criteria") bits.push(s.crit.map((n, i) => `${n}: ${(c.scores||[])[i] || 0}`).join(", ") + ` = ${critTotal(c)}`);
    if(m === "consent"){ const k = consentCount(c); bits.push(`${k.love} love, ${k.live} live with, ${k.block} block`); }
    if(m === "grid" && c.gx != null) bits.push(`${Math.round(c.gx*100)} across, ${Math.round((1-c.gy)*100)} up`);
    if(m === "stress") bits.push(c.stress ? "breaks if: " + c.stress : "untested");
    if(m === "constraint") bits.push(c.fails === true ? "fails" : c.fails === false ? "survives" : "not judged");
    if(c.cut) bits.push("cut");
    return `  ${c.text || "[image]"}${s.anon ? "" : "  (" + c.authorName + ")"}\n     ${bits.join(" · ")}`;
  };
  let head = `RIFF ROOM — group ${pad(state.group)} — ${label}\nspark: ${state.prompt || "none recorded"}\n${valuesLine()}\n`;
  if(m === "grid") head += `axes: ${s.ax.w} to ${s.ax.e}, ${s.ax.s} to ${s.ax.n}\n`;
  if(m === "constraint") head += `constraint: it has to ${s.constraint || "(not written)"}\n`;
  if(m === "bracket" && s.bracket && s.bracket.champ){
    const c = state.cards[s.bracket.champ];
    head += `last one standing: ${c ? c.text : "gone"}\n`;
  }
  return head + "\n" + cards.map(line).join("\n");
}

  };
  const ts = all.map(c => c.ts);
  const perArtist = Object.values(state.members).map(m => all.filter(c => c.authorId === m.id).length);
  return {
    artists: Object.keys(state.members).length,
    cards_made: all.length,
    cards_in_frame: frame.length,
    riffs: frame.filter(c => c.parentId).length,
    riff_share: frame.length ? (frame.filter(c => c.parentId).length / frame.length).toFixed(2) : 0,
    longest_chain: frame.length ? Math.max(...frame.map(depth)) : 0,
    combined_cards: frame.filter(c => c.combined).length,
    clusters: Object.keys(state.buckets).length,
    values_written: valueList().length,
    cut_cards: frame.filter(c => c.cut).length,
    dots_cast: frame.reduce((a, c) => a + sumVotes(c), 0),
    stress_notes: frame.filter(c => c.stress).length,
    brief_started: B().direction || B().crit.filter(x => x.trim()).length ? 1 : 0,
    distinct_days: days.size,
    span_hours: ts.length ? ((Math.max(...ts) - Math.min(...ts)) / 3.6e6).toFixed(1) : 0,
    cards_per_artist_low: perArtist.length ? Math.min(...perArtist) : 0,
    cards_per_artist_high: perArtist.length ? Math.max(...perArtist) : 0,
    check_ins: Object.keys(state.checkins || {}).length
  };
}

function toCSV(rows){
  return rows.map(r => r.map(c => `"${String(c == null ? "" : c).replace(/"/g, '""')}"`).join(",")).join("\r\n");
}
function download(name, text, type){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type: type || "text/csv;charset=utf-8"}));
  a.download = name;
  a.click();
}
function exportData(){
  const stamp = new Date().toISOString().slice(0, 10);
  const g = pad(state.group);

  const head = ["tool","room","group","participant","submitted"]
    .concat(ITEMS.map(i => i[1]))
    .concat(DIMS.map(d => d + "_mean"))
    .concat(OPENS.map(o => o[0]));
  const rows = [head];
  Object.values(state.checkins || {}).forEach(r => {
    const line = [r.tool || TOOL_ID, r.room || ROOM, r.group, r.code, new Date(r.ts).toISOString()];
    ITEMS.forEach(([, k]) => line.push((r.answers || {})[k] ?? ""));
    DIMS.forEach(d => {
      const keys = ITEMS.filter(i => i[0] === d);
      let s = 0, n = 0;
      keys.forEach(([, k, , rev]) => { const v = (r.answers || {})[k]; if(v){ s += revScore(v, rev); n++; } });
      line.push(n ? (s / n).toFixed(2) : "");
    });
    OPENS.forEach(([k]) => line.push((r.open || {})[k] || ""));
    rows.push(line);
  });
  download(`${TOOL_ID}-checkins-group-${g}-${stamp}.csv`, toCSV(rows));

  const t = traces();
  const tRows = [["tool","room","group"].concat(Object.keys(t)),
                 [TOOL_ID, ROOM, state.group].concat(Object.values(t))];
  const perPerson = [["tool","room","group","participant","artist_name","cards_made","in_frame","riffs_made","dots_spent","days_active"]];
  Object.values(state.members).forEach(m => {
    const mine = Object.values(state.cards).filter(c => c.authorId === m.id);
    const days = new Set(mine.map(c => new Date(c.ts).toISOString().slice(0, 10)));
    perPerson.push([TOOL_ID, ROOM, state.group, pcode(m.id), m.name,
      mine.length,
      mine.filter(c => c.zone === "stage").length,
      mine.filter(c => c.parentId).length,
      Object.values(state.cards).reduce((a, c) => a + ((c.votes || {})[m.id] || 0), 0),
      days.size]);
  });
  download(`${TOOL_ID}-traces-group-${g}-${stamp}.csv`,
    toCSV(tRows) + "\r\n\r\n" + toCSV(perPerson));
  toast("two csv files saved");
}

function timeAgo(t){
  const m = Math.round((Date.now() - t) / 60000);
  if(m < 2) return "here now";
  if(m < 60) return m + " min ago";
  const h = Math.round(m / 60);
  if(h < 24) return h + (h === 1 ? " hour ago" : " hours ago");
  const d = Math.round(h / 24);
  return d + (d === 1 ? " day ago" : " days ago");
}

   10g. PHASE FIVE: THE CHECK IN
   The last task in the process. Same fifteen items every time,
   so answers stack across every tool that carries this section.

let draft = null;
function myCheck(){ return (state.checkins || {})[state.me ? state.me.id : ""] || null; }

function dimMean(recs, d){
  const keys = ITEMS.filter(i => i[0] === d);
  let s = 0, n = 0;
  recs.forEach(r => keys.forEach(([, k, , rev]) => {
    const v = (r.answers || {})[k];
    if(v){ s += revScore(v, rev); n++; }
  }));
  return n ? s / n : 0;
}
function itemMean(recs, key, rev){
  let s = 0, n = 0;
  recs.forEach(r => { const v = (r.answers || {})[key]; if(v){ s += revScore(v, rev); n++; } });
  return n ? s / n : 0;
}
function itemSpread(recs, key, rev){
  const c = [0,0,0,0,0];
  recs.forEach(r => { const v = (r.answers || {})[key]; if(v) c[revScore(v, rev) - 1]++; });
  return c;
}

/* ---------- charts, drawn as plain svg so the export carries them ---------- */
function barChart(rows, o = {}){
  // stacked puts each label on its own line above a full width bar, for the
  // long item wordings; the default keeps label and bar side by side
  const w = o.w || 392, stacked = !!o.stacked;
  const rowH = stacked ? 40 : 34, pad = stacked ? 0 : 118, bw = w - pad - 34;
  const h = rows.length * rowH + 26;
  let out = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" xmlns="http://www.w3.org/2000/svg" font-family="Archivo, Arial, sans-serif">`;
  for(let g = 1; g <= 5; g++){
    const x = pad + (bw * (g - 1) / 4);
    out += `<line x1="${x}" y1="6" x2="${x}" y2="${rows.length * rowH + 6}" stroke="#1C949B" stroke-width="1" opacity="${stacked ? ".18" : ".35"}"/>`;
    out += `<text x="${x}" y="${rows.length * rowH + 20}" fill="#48757A" font-size="9" text-anchor="middle">${g}</text>`;
  }
  rows.forEach((r, i) => {
    const y = 12 + i * rowH;
    const val = Math.max(0, Math.min(5, r.value));
    const len = val ? bw * (val - 1) / 4 : 0;
    const by = stacked ? y + 16 : y + 3;
    out += `<text x="0" y="${stacked ? y + 10 : y + 13}" fill="#79A6A8" font-size="10.5" letter-spacing="${stacked ? 0 : 1}">${esc(r.label)}</text>`;
    out += `<rect x="${pad}" y="${by}" width="${Math.max(len, 1.5)}" height="${stacked ? 11 : 15}" fill="${r.color || "#CF6587"}"/>`;
    if(r.mark){
      const mx = pad + bw * (Math.max(1, Math.min(5, r.mark)) - 1) / 4;
      out += `<rect x="${mx - 1}" y="${by - 3}" width="2.5" height="${stacked ? 17 : 21}" fill="#D5A830"/>`;
    }
    out += `<text x="${w - 30}" y="${by + (stacked ? 10 : 12)}" fill="#FFFFFF" font-size="12" font-weight="700">${val ? val.toFixed(1) : "\u2013"}</text>`;
  });
  return out + "</svg>";
}
function spreadChart(rows, o = {}){
  const w = o.w || 392, rowH = 30, pad = 118, bw = w - pad - 34;
  const h = rows.length * rowH + 24;
  const max = Math.max(1, ...rows.map(r => Math.max(...r.counts)));
  let out = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" xmlns="http://www.w3.org/2000/svg" font-family="Archivo, Arial, sans-serif">`;
  rows.forEach((r, i) => {
    const y = 10 + i * rowH;
    out += `<text x="0" y="${y + 14}" fill="#79A6A8" font-size="10.5">${esc(r.label)}</text>`;
    r.counts.forEach((c, j) => {
      const cw = bw / 5 - 5, x = pad + j * (bw / 5);
      const bh = Math.max(2, 18 * (c / max));
      out += `<rect x="${x}" y="${y + 20 - bh}" width="${cw}" height="${bh}" fill="${c ? "#42ADAD" : "#1C949B"}" opacity="${c ? 1 : .25}"/>`;
      if(c) out += `<text x="${x + cw / 2}" y="${y + 18 - bh}" fill="#79A6A8" font-size="8" text-anchor="middle">${c}</text>`;
    });
  });
  for(let g = 0; g < 5; g++){
    const cw = bw / 5 - 5, x = pad + g * (bw / 5);
    out += `<text x="${x + cw / 2}" y="${h - 2}" fill="#48757A" font-size="8" text-anchor="middle">${g + 1}</text>`;
  }
  return out + "</svg>";
}

function checkCharts(){
  const recs = Object.values(state.checkins || {});
  const mine = myCheck() ? [myCheck()] : [];
  const dimRows = DIMS.map(d => ({
    label: d, value: dimMean(recs, d), color: "#CF6587",
    mark: mine.length ? dimMean(mine, d) : 0
  }));
  const itemRows = ITEMS.map(([, k, text, rev]) => ({
    label: (rev ? "\u2726 " : "") + text.replace(/\.$/, ""),
    value: itemMean(recs, k, rev), color: rev ? "#D5A830" : "#42ADAD"
  }));
  const spreadRows = DIMS.map(d => {
    const c = [0,0,0,0,0];
    ITEMS.filter(i => i[0] === d).forEach(([, k, , rev]) =>
      itemSpread(recs, k, rev).forEach((n, j) => c[j] += n));
    return {label: d, counts: c};
  });
  return {recs, dimRows, itemRows, spreadRows};
}

    sc.className = "adminrow";
    sc.innerHTML = `<span class="nm">What it applies to<small>Switch between this one group and the whole room.</small></span>`;
    const one = document.createElement("button"), all = document.createElement("button");
    const paintScope = () => {
      one.textContent = "group " + pad(state.group);
      all.textContent = "all " + GROUP_COUNT + " groups";
      one.style.borderColor = scope === "group" ? "var(--mint)" : "";
      one.style.color = scope === "group" ? "var(--mint)" : "";
      all.style.borderColor = scope === "all" ? "var(--mars)" : "";
      all.style.color = scope === "all" ? "var(--mars)" : "";
    };
    one.onclick = () => { scope = "group"; paintScope(); };
    all.onclick = () => { scope = "all"; paintScope(); };
    paintScope();
    sc.append(one, all);
    sheet.appendChild(sc);

    const lab = document.createElement("label");
    lab.textContent = "what to remove";
    sheet.appendChild(lab);
    const rows = document.createElement("div");
    rows.className = "checkrow";
    PARTS.forEach(([k, t]) => {
      const b = document.createElement("button");
      b.textContent = t;
      b.dataset.on = chosen.has(k) ? "1" : "0";
      b.onclick = () => {
        chosen.has(k) ? chosen.delete(k) : chosen.add(k);
        b.dataset.on = chosen.has(k) ? "1" : "0";
      };
      rows.appendChild(b);
    });
    sheet.appendChild(rows);

    const conf = document.createElement("div");
    conf.className = "erase";
    const inp = document.createElement("input");
    inp.type = "text"; inp.placeholder = "type ERASE to confirm"; inp.autocomplete = "off";
    const go = document.createElement("button");
    go.textContent = "erase";
    go.onclick = () => {
      if(inp.value.trim().toUpperCase() !== "ERASE"){ toast("type ERASE to confirm"); inp.focus(); return; }
      if(!chosen.size){ toast("nothing is selected"); return; }
      wipe([...chosen], scope);
      close();
    };
    conf.append(inp, go);
    sheet.appendChild(conf);

    const done = document.createElement("button");
    done.className = "magnetic"; done.textContent = "close";
    done.onclick = close;
    sheet.appendChild(done);
    magnetise(done);
  });
}

function backupAll(){
  const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-");
  const save = data => download(`${TOOL_ID}-backup-${ROOM}-${stamp}.json`,
    JSON.stringify(data, null, 2), "application/json");
  if(state.live){
    db.ref(ROOM).once("value").then(sn => { save({room: ROOM, saved: Date.now(), groups: sn.val()}); toast("backup saved"); })
      .catch(() => toast("could not read the database"));
  }else{
    save({room: ROOM, saved: Date.now(), groups: {["g" + state.group]: {
      cards: state.cards, members: state.members, buckets: state.buckets,
      values: state.values, brief: state.brief, checkins: state.checkins,
      settings: state.settings, prompt: state.prompt, phase: state.phase}}});
    toast("backup saved");
  }
}

function wipe(parts, scope){
  const groups = scope === "all" ? Array.from({length: GROUP_COUNT}, (_, i) => i + 1) : [state.group];
  if(state.live){
    const updates = {};
    groups.forEach(g => parts.forEach(p => updates[`g${g}/${p}`] = null));
    db.ref(ROOM).update(updates)
      .then(() => toast(`cleared ${parts.length} ${parts.length === 1 ? "part" : "parts"} in ${groups.length === 1 ? "group " + pad(groups[0]) : "every group"}`))
      .catch(() => toast("the database refused that"));
  }else{
    const map = {cards:"cards", buckets:"buckets", values:"values", brief:"brief",
                 settings:"settings", checkins:"checkins", members:"members"};
    parts.forEach(p => {
      if(map[p]) state[map[p]] = {};
      if(p === "prompt"){ state.prompt = ""; $("#promptInput").value = ""; }
      if(p === "phase"){ state.phase = 1; state.groupPhase = 1; }
    });
    toast("cleared");
  }
  if(parts.includes("members")) forgetMe();
  state.sel.clear();
  state.selected = null;
  draft = null;
  render();
}

$(".wordmark").onclick = askInstructor;
if((location.hash || "").toLowerCase() === "#instructor") setTimeout(askInstructor, 1400);

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])); }
function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
addEventListener("resize", () => renderStage());

$("#notMe").onclick = () => { forgetMe(); location.reload(); };

connect();
render();
setTimeout(() => {
  $("#loader").classList.add("gone");
  // walk an artist straight back into the group they were last in
  let found = null;
  for(let g = 1; g <= 8 && !found; g++){
    const saved = recall(g);
    if(saved && saved.id) found = {g, saved};
  }
  if(found){
    state.me = {id: found.saved.id, name: found.saved.name};
    state.group = found.g;
    listen();
    setTimeout(claimSlot, 500);
    $("#whoBadge").hidden = false;
    $("#whoName").textContent = found.saved.name;
    setTimeout(() => toast("welcome back, " + found.saved.name), 900);
  }else{
    openJoin();
  }
}, 1100);
</script>

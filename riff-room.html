<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riff Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   RIFF ROOM
   Studio aesthetic, collage palette: pinks and greens on jet.
   ============================================================ */

:root{
  --void:#0B2A2E;
  --surface:#123539;
  --raise:#194247;
  --cream:#FFFFFF;
  --pink:#CF6587;
  --gold:#D5A830;
  --mars:#AF2123;
  --mint:#42ADAD;
  --grass:#D5A830;
  --sea:#42ADAD;
  --teal:#0E7177;
  --line:rgba(66,173,173,.34);
  --line-soft:rgba(66,173,173,.18);
  --text:#FFFFFF;
  --dim:#79A6A8;
  --faint:#48757A;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:'Archivo',system-ui,-apple-system,'Helvetica Neue',sans-serif;
  font-size:15px;
  color:var(--text);
  background:var(--void);
  overflow:hidden;
  cursor:none;
}
button,input,textarea,select{font-family:inherit;color:inherit;cursor:none}
button{background:none;border:0}
a{color:inherit}

/* ---------- loader ---------- */
#loader{
  position:fixed;inset:0;z-index:10000;background:var(--void);
  display:flex;align-items:center;justify-content:center;
  transition:transform .9s cubic-bezier(.76,0,.24,1);
}
#loader.gone{transform:translateY(-101%)}
#loader .mark{
  font-size:clamp(38px,7vw,86px);font-weight:800;letter-spacing:-.05em;
  line-height:.9;text-align:center;color:var(--pink);
}
#loader .mark small{display:block;font-size:12px;font-weight:500;letter-spacing:.28em;color:var(--mint);margin-top:14px}

/* ---------- cursor ---------- */
#cursor{
  position:fixed;top:0;left:0;width:9px;height:9px;border-radius:50%;
  background:var(--pink);z-index:10001;pointer-events:none;transform:translate(-50%,-50%);
}
#follower{
  position:fixed;top:0;left:0;width:38px;height:38px;border-radius:50%;
  border:1px solid rgba(66,173,173,.75);z-index:10000;pointer-events:none;
  transform:translate(-50%,-50%);transition:width .25s,height .25s,background .25s,border-color .25s;
}
#follower.big{width:62px;height:62px;background:rgba(207,101,135,.2);border-color:var(--pink)}
#follower.grab{width:52px;height:52px;background:rgba(66,173,173,.22);border-color:var(--mint)}

#starfield{position:fixed;inset:0;z-index:-1;display:block}

/* ---------- top bar ---------- */
.topbar{
  position:relative;z-index:20;
  display:flex;align-items:center;gap:26px;
  padding:16px 26px 15px;
  border-bottom:1px solid var(--line);
}
.wordmark{font-size:20px;font-weight:800;letter-spacing:-.045em;line-height:1;white-space:nowrap}
.wordmark i{font-style:normal;color:var(--pink)}

.prompt{flex:1;min-width:0;display:flex;align-items:baseline;gap:14px}
.prompt label{font-size:11px;font-weight:600;letter-spacing:.22em;color:var(--mint);white-space:nowrap}
.prompt input{
  flex:1;min-width:0;background:transparent;border:0;outline:0;
  border-bottom:1px solid var(--line-soft);
  color:var(--cream);font-size:16px;font-weight:500;letter-spacing:-.01em;padding:4px 0;
  transition:border-color .25s;
}
.prompt input:focus{border-bottom-color:var(--pink)}
.prompt input::placeholder{color:var(--faint)}

.who{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:500;white-space:nowrap}
.who .swatch{width:9px;height:9px;border-radius:50%}
.linkbtn{
  font-size:13px;font-weight:500;color:var(--dim);padding:4px 0;position:relative;
  transition:color .25s;white-space:nowrap;
}
.linkbtn::after{content:"";position:absolute;left:0;bottom:0;width:0;height:1px;background:var(--pink);transition:width .3s}
.linkbtn:hover{color:var(--cream)}
.linkbtn:hover::after{width:100%}

/* right edge badge, in the manner of a studio site */
#edge{
  position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:30;
  border-left:1px solid var(--line);padding:22px 9px;
  writing-mode:vertical-rl;font-size:10px;letter-spacing:.3em;color:var(--dim);
  background:var(--void);
}
#edge b{font-weight:600;color:var(--mint)}

/* ---------- group tabs ---------- */
.tabs{
  position:relative;z-index:20;display:flex;align-items:center;gap:0;
  padding:0 26px;border-bottom:1px solid var(--line);
  overflow-x:auto;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  font-size:12px;font-weight:500;letter-spacing:.06em;color:var(--dim);
  padding:11px 18px;border-right:1px solid var(--line-soft);white-space:nowrap;
  transition:color .25s,background .25s;
}
.tab:first-child{border-left:1px solid var(--line-soft)}
.tab:hover{color:var(--mint)}
.tab[data-active="1"]{background:var(--pink);color:var(--void);font-weight:600}
.tabs .spacer{flex:1}
.tabs select{
  background:transparent;border:0;outline:0;color:var(--dim);
  font-size:11px;letter-spacing:.14em;padding:11px 0 11px 18px;
}
.tabs select option{background:var(--surface);color:var(--cream)}

/* ---------- the chamber ---------- */
.board{
  display:grid;
  grid-template-columns:212px 1fr 212px;
  grid-template-rows:150px 1fr 150px;
  gap:26px;padding:30px 44px 30px 30px;
  height:calc(100vh - 100px);
  perspective:1700px;perspective-origin:50% 50%;
}
.zone{display:flex;gap:22px;min-width:0;min-height:0}
.zone-left{grid-column:1;grid-row:1/4;flex-direction:column}
.zone-right{grid-column:3;grid-row:1/4;flex-direction:column}
.zone-top{grid-column:2;grid-row:1}
.zone-bottom{grid-column:2;grid-row:3}
.zone .tray{flex:1}

.tray{
  background:var(--surface);
  border:1px solid var(--line);
  display:flex;flex-direction:column;min-width:0;min-height:0;
  opacity:0;transform:translateY(14px);
  transition:opacity .7s ease,transform .7s ease;
}
.tray.in{opacity:1;transform:none}
/* the four walls hinge toward the frame */
.zone-left   .tray.in{transform:rotateY(15deg)  translateZ(-70px)}
.zone-right  .tray.in{transform:rotateY(-15deg) translateZ(-70px)}
.zone-top    .tray.in{transform:rotateX(-14deg) translateZ(-70px)}
.zone-bottom .tray.in{transform:rotateX(14deg)  translateZ(-70px)}
.zone-left .tray{transform-origin:100% 50%}
.zone-right .tray{transform-origin:0 50%}
.zone-top .tray{transform-origin:50% 100%}
.zone-bottom .tray{transform-origin:50% 0}

.tray[data-mine="1"]{background:var(--raise);border-color:rgba(66,173,173,.6)}
.tray[data-empty="1"]{background:transparent;border-style:dashed;border-color:var(--line-soft)}
.tray-head{
  display:flex;align-items:baseline;gap:9px;
  padding:11px 12px 9px;border-bottom:1px solid var(--line-soft);
}
.tray-head .num{font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--dim)}
.tray-head .nm{font-size:13.5px;font-weight:600;letter-spacing:-.015em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tray-head .count{margin-left:auto;font-size:11px;color:var(--dim)}
.tray-body{flex:1;overflow:auto;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.zone-left .tray-body,.zone-right .tray-body{flex-direction:column;flex-wrap:nowrap}
.tray-foot{padding:9px 10px;border-top:1px solid var(--line-soft);display:flex;gap:10px;align-items:center}
.tray-foot input{
  flex:1;min-width:0;background:transparent;border:0;outline:0;
  border-bottom:1px solid var(--line-soft);padding:5px 0;font-size:12.5px;
  transition:border-color .25s;
}
.tray-foot input:focus{border-bottom-color:var(--pink)}
.tray-foot input::placeholder{color:var(--faint)}
.mini{font-size:11px;letter-spacing:.12em;color:var(--mint);transition:color .25s;white-space:nowrap}
.mini:hover{color:var(--pink)}
.tray-hint{padding:12px;font-size:11.5px;line-height:1.5;color:var(--faint)}

/* ---------- parked cards ---------- */
.chip{
  background:var(--raise);border:1px solid var(--line-soft);
  border-left:3px solid var(--c,var(--mint));
  padding:8px 9px;font-size:12.5px;font-weight:500;line-height:1.35;
  touch-action:none;user-select:none;max-width:100%;word-break:break-word;
  transition:background .2s,border-color .2s;
}
.chip:hover{background:#1D4E53;border-color:var(--line);border-left-color:var(--c,var(--mint))}
.zone-top .chip,.zone-bottom .chip{width:132px}
.chip img{display:block;width:100%;margin-bottom:6px}
.chip .x{float:right;margin-left:8px;font-size:11px;color:var(--faint)}
.chip .x:hover{color:var(--pink)}

/* ---------- the frame ---------- */
.stage-wrap{grid-column:2;grid-row:2;position:relative;min-width:0;min-height:0}
.stage{
  position:absolute;inset:0;
  border:1px solid rgba(66,173,173,.6);
  overflow:hidden;background:rgba(66,173,173,.04);
  transition:border-color .3s,background .3s;
}
.stage::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(rgba(213,168,48,.16) 1px,transparent 1px) 0 0/72px 72px,
    linear-gradient(90deg,rgba(213,168,48,.16) 1px,transparent 1px) 0 0/72px 72px;
}
.stage.hot{border-color:var(--pink);background:rgba(207,101,135,.09)}
.stage-label{
  position:absolute;top:14px;left:16px;z-index:5;
  font-size:10.5px;letter-spacing:.28em;color:var(--mint);
}
.empty-note{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;text-align:center;
  pointer-events:none;padding:24px;
}
.empty-note .big{
  font-size:clamp(30px,4.6vw,62px);font-weight:800;letter-spacing:-.05em;line-height:.94;
  color:var(--cream);
}
.empty-note .sub{font-size:12px;letter-spacing:.2em;color:var(--mint);opacity:.7}
#wires{position:absolute;inset:0;pointer-events:none}

.card{
  position:absolute;width:196px;
  background:var(--surface);border:1px solid var(--line);
  border-top:2px solid var(--c,var(--mint));
  padding:12px 13px 11px;
  font-size:14px;font-weight:500;line-height:1.38;letter-spacing:-.01em;
  touch-action:none;user-select:none;word-break:break-word;
  transform:rotate(var(--rot,0deg));
  box-shadow:0 22px 44px rgba(4,20,22,.75);
  transition:border-color .2s,background .2s;
}
.card:hover{background:var(--raise);border-color:rgba(66,173,173,.55);border-top-color:var(--c,var(--mint))}
.card.img-card{width:224px}
.card img{display:block;width:100%;margin-bottom:9px}
.card .by{display:block;margin-top:11px;font-size:10px;letter-spacing:.16em;color:var(--c,var(--mint))}
.card.seed{background:var(--mint);color:var(--void);border-color:var(--mint)}
.card.seed .by{color:var(--void);opacity:.6}
.card.seed:hover{background:#5CC4C4}
.card.seed::before{
  content:"01 seed";position:absolute;top:-9px;left:12px;background:var(--pink);color:var(--void);
  font-size:9px;font-weight:700;letter-spacing:.2em;padding:1px 7px;
}
.card.riff::after{
  content:"yes, and";position:absolute;top:-9px;right:12px;background:var(--void);
  border:1px solid var(--line);color:var(--mint);
  font-size:9px;letter-spacing:.16em;padding:1px 7px;
}
.card.sel{border-color:var(--pink);box-shadow:0 0 0 1px var(--pink),0 22px 44px rgba(4,20,22,.75)}
.card .acts{display:flex;gap:16px;margin-top:12px;padding-top:9px;border-top:1px solid var(--line-soft)}
.card.seed .acts{border-top-color:rgba(11,42,46,.22)}
.card .acts button{font-size:11px;letter-spacing:.12em;color:var(--dim);transition:color .2s}
.card .acts button:hover{color:var(--pink)}
.card.seed .acts button{color:var(--teal)}
.card.seed .acts button:hover{color:var(--mars)}
.drop-target{border-color:var(--pink)!important;box-shadow:0 0 0 1px var(--pink),0 22px 44px rgba(4,20,22,.75)}
.ghost{position:fixed;z-index:9999;pointer-events:none;opacity:.96;
  transform:rotate(-1.5deg)!important;box-shadow:0 40px 70px rgba(3,16,18,.85)!important}

/* ---------- composer ---------- */
.composer{
  position:fixed;z-index:9000;width:320px;
  background:var(--surface);border:1px solid rgba(66,173,173,.55);padding:18px;
  box-shadow:0 40px 90px rgba(3,16,18,.85);
}
.composer h4{margin:0 0 14px;font-size:11px;letter-spacing:.2em;color:var(--mint);font-weight:600}
.composer h4 em{font-style:normal;color:var(--cream);letter-spacing:0;font-size:13px}
.composer textarea{
  width:100%;height:82px;resize:none;background:transparent;
  border:0;border-bottom:1px solid var(--line);outline:0;
  padding:6px 0;font-size:15px;font-weight:500;letter-spacing:-.01em;line-height:1.4;
  transition:border-color .25s;
}
.composer textarea:focus{border-bottom-color:var(--pink)}
.sparks{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 16px}
.sparks button{font-size:11px;color:var(--mint);border:1px solid var(--line-soft);padding:4px 9px;transition:.2s}
.sparks button:hover{color:var(--void);background:var(--mint);border-color:var(--mint)}
.composer .row{display:flex;gap:22px;align-items:center}
.composer .row button{font-size:12px;letter-spacing:.14em;color:var(--dim);transition:color .2s}
.composer .row button:hover{color:var(--cream)}
.composer .row .go{margin-left:auto;color:var(--pink);font-weight:600}

/* ---------- sheets ---------- */
.veil{position:fixed;inset:0;background:rgba(6,26,29,.92);display:flex;align-items:center;justify-content:center;z-index:9500;padding:24px}
.sheet{
  background:var(--surface);border:1px solid var(--line);
  padding:46px 46px 40px;width:min(620px,100%);max-height:90vh;overflow:auto;
}
.sheet h2{
  font-size:clamp(34px,5vw,58px);font-weight:800;letter-spacing:-.05em;line-height:.95;
  margin:0 0 6px;color:var(--pink);
}
.sheet .eyebrow{font-size:10.5px;letter-spacing:.3em;color:var(--mint);margin-bottom:22px}
.sheet p{font-size:15px;line-height:1.6;color:#CDE4E5;margin:14px 0;max-width:60ch}
.sheet ol{list-style:none;counter-reset:s;padding:0;margin:20px 0}
.sheet ol li{
  counter-increment:s;display:flex;gap:18px;padding:14px 0;
  border-top:1px solid var(--line-soft);font-size:14.5px;line-height:1.55;color:#CDE4E5;
}
.sheet ol li::before{content:"0" counter(s);font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--grass);padding-top:3px}
.sheet label{display:block;font-size:10.5px;letter-spacing:.3em;color:var(--mint);margin:30px 0 10px}
.sheet input[type=text]{
  width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);outline:0;
  padding:10px 0;font-size:clamp(22px,3.4vw,32px);font-weight:700;letter-spacing:-.04em;
  transition:border-color .25s;
}
.sheet input[type=text]:focus{border-bottom-color:var(--pink)}
.sheet input[type=text]::placeholder{color:var(--faint);font-weight:500;letter-spacing:-.02em}
.grouppick{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--line-soft)}
.grouppick button{
  flex:1 0 auto;min-width:76px;padding:12px 0;font-size:12px;letter-spacing:.1em;
  color:var(--dim);border-right:1px solid var(--line-soft);transition:.2s;
}
.grouppick button:last-child{border-right:0}
.grouppick button:hover{color:var(--mint)}
.grouppick button[data-on="1"]{background:var(--mint);color:var(--void);font-weight:600}
.rulecard{border-top:1px solid var(--line-soft);padding:16px 0;font-size:14px;line-height:1.55;color:#CDE4E5}
.rulecard b{display:block;font-size:15px;font-weight:700;letter-spacing:-.02em;color:var(--mint);margin-bottom:5px}

.magnetic{
  margin-top:34px;display:inline-block;border:1px solid var(--pink);color:var(--pink);
  padding:16px 42px;font-size:12px;letter-spacing:.24em;font-weight:600;
  transition:background .3s,color .3s,transform .25s cubic-bezier(.22,1,.36,1);
}
.magnetic:hover{background:var(--pink);color:var(--void)}

@media (max-width:1000px){
  body{cursor:auto;overflow:auto}
  button,input,textarea,select{cursor:auto}
  #cursor,#follower,#edge{display:none}
  .board{grid-template-columns:1fr;grid-template-rows:auto 62vh auto;height:auto;padding:18px;perspective:none;gap:16px}
  .zone-left,.zone-right{grid-column:1;grid-row:auto;flex-direction:row;overflow-x:auto}
  .zone-top{grid-row:auto}.zone-bottom{grid-row:auto}
  .stage-wrap{grid-column:1;grid-row:2}
  .zone .tray{min-width:210px}
  .zone .tray.in{transform:none}
  .topbar{flex-wrap:wrap;gap:14px;padding:14px 18px}
  .sheet{padding:28px}
}
/* ---------- phase button + toast ---------- */
.phasebtn{
  font-size:11px;letter-spacing:.2em;font-weight:600;
  border:1px solid var(--pink);color:var(--pink);padding:9px 16px;
  transition:background .25s,color .25s;white-space:nowrap;
}
.phasebtn:hover{background:var(--pink);color:var(--void)}
#toast{
  position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);
  background:var(--mint);color:var(--void);font-size:12px;font-weight:600;
  letter-spacing:.14em;padding:11px 22px;z-index:9800;
  opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;
}
#toast.up{opacity:1;transform:translate(-50%,0)}

/* ---------- phase two ---------- */
.board[hidden],#sortView[hidden]{display:none!important}
#sortView{height:calc(100vh - 100px);display:flex;flex-direction:column;padding:22px 44px 22px 30px}
.sortbar{display:flex;align-items:center;gap:24px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.sortbar .lede{font-size:10.5px;letter-spacing:.3em;color:var(--mint)}
.sortbar .lede b{color:var(--cream);font-weight:600}
.sortbar .push{flex:1}
.sortbar button{font-size:11px;letter-spacing:.16em;color:var(--dim);transition:color .2s;white-space:nowrap}
.sortbar button:hover{color:var(--pink)}
.sortbar button[disabled]{color:var(--faint);cursor:none}
.sortbar .count{font-size:11px;letter-spacing:.16em;color:var(--pink)}

.sortboard{flex:1;display:flex;gap:22px;min-height:0;padding-top:18px}
.pool{width:250px;flex:none;display:flex;flex-direction:column;border:1px solid var(--line);background:var(--surface)}
.cols{flex:1;display:flex;gap:18px;overflow-x:auto;min-width:0;padding-bottom:6px}
.col{
  width:262px;flex:none;display:flex;flex-direction:column;
  border:1px solid var(--line);background:var(--surface);
}
.col.wide{width:auto}
.pane-head{
  display:flex;align-items:center;gap:9px;padding:11px 12px;
  border-bottom:1px solid var(--line-soft);
}
.pane-head .tag{font-size:10px;letter-spacing:.26em;color:var(--mint);white-space:nowrap}
.pane-head input{
  flex:1;min-width:0;background:transparent;border:0;outline:0;
  font-size:14px;font-weight:700;letter-spacing:-.02em;color:var(--cream);
  border-bottom:1px solid transparent;padding:2px 0;transition:border-color .2s;
}
.pane-head input:focus{border-bottom-color:var(--pink)}
.pane-head .n{font-size:11px;color:var(--dim)}
.pane-head .kill{font-size:12px;color:var(--faint)}
.pane-head .kill:hover{color:var(--pink)}
.pane-body{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:9px;min-height:60px}
.pane-body.drop{background:rgba(207,101,135,.12);outline:1px dashed var(--pink);outline-offset:-4px}
.pane-empty{font-size:11.5px;line-height:1.5;color:var(--faint);padding:6px 2px}

.scard{
  border:1px solid var(--line-soft);border-left:3px solid var(--c,var(--mint));
  background:var(--raise);padding:9px 10px;touch-action:none;user-select:none;
  transition:border-color .2s,background .2s;
}
.scard:hover{border-color:var(--line)}
.scard.picked{border-color:var(--pink);background:#1D4E53}
.scard.starred{border-left-width:6px}
.scard.overlap{border-style:dashed;border-color:var(--sea)}
.scard .top{display:flex;align-items:baseline;gap:8px;margin-bottom:5px}
.scard .rank{font-size:10px;letter-spacing:.14em;color:var(--mint);font-weight:600}
.scard .who{margin-left:auto;font-size:9.5px;letter-spacing:.14em;color:var(--c,var(--mint))}
.scard .txt{font-size:13px;font-weight:500;line-height:1.4;word-break:break-word}
.scard img{display:block;width:100%;margin-bottom:6px}
.scard .src{margin-top:7px;padding-top:6px;border-top:1px solid var(--line-soft);
  font-size:10.5px;line-height:1.45;color:var(--dim)}
.scard .src div{padding:1px 0}
.scard .acts{display:flex;gap:12px;margin-top:8px}
.scard .acts button{font-size:10px;letter-spacing:.12em;color:var(--faint);transition:color .2s}
.scard .acts button:hover{color:var(--pink)}
.scard .acts button.on{color:var(--mint)}
.scard .flags{display:flex;gap:6px;margin-top:6px}
.scard .flag{font-size:9px;letter-spacing:.16em;padding:1px 6px;border:1px solid var(--line-soft);color:var(--mint)}
.scard .flag.ov{color:var(--sea);border-color:var(--sea)}

@media (max-width:1000px){
  #sortView{height:auto;padding:18px}
  .sortboard{flex-direction:column}
  .pool{width:auto}
  .cols{overflow-x:auto}
}

/* ---------- phase three ---------- */
#decideView[hidden]{display:none!important}
#decideView{height:calc(100vh - 100px);display:flex;flex-direction:column;padding:22px 44px 22px 30px}
.phases{display:flex;border:1px solid var(--pink)}
.phases button{
  font-size:10.5px;letter-spacing:.18em;font-weight:600;color:var(--pink);
  padding:9px 13px;border-right:1px solid var(--pink);transition:background .2s,color .2s;white-space:nowrap;
}
.phases button:last-child{border-right:0}
.phases button:hover{background:rgba(207,101,135,.22)}
.phases button[data-on="1"]{background:var(--pink);color:var(--void)}

.methods{display:flex;gap:0;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.methods button{
  font-size:11px;letter-spacing:.14em;color:var(--dim);padding:10px 14px;
  border-right:1px solid var(--line-soft);transition:color .2s,background .2s;white-space:nowrap;
}
.methods button:hover{color:var(--mint)}
.methods button[data-on="1"]{background:var(--mint);color:var(--void);font-weight:600}

.opts{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--line-soft)}
.opts .blurb{font-size:11.5px;line-height:1.5;color:var(--dim);max-width:52ch}
.opts .push{flex:1}
.opts button{font-size:11px;letter-spacing:.14em;color:var(--dim);transition:color .2s;white-space:nowrap}
.opts button:hover{color:var(--pink)}
.opts button.on{color:var(--mint)}
.opts .field{display:flex;align-items:baseline;gap:8px}
.opts .field span{font-size:10px;letter-spacing:.2em;color:var(--mint);white-space:nowrap}
.opts input[type=text],.opts input[type=number]{
  background:transparent;border:0;border-bottom:1px solid var(--line-soft);outline:0;
  font-size:13px;font-weight:600;color:var(--cream);padding:3px 0;transition:border-color .2s;
}
.opts input[type=text]{min-width:150px}
.opts input[type=number]{width:52px}
.opts input:focus{border-bottom-color:var(--pink)}
.opts .live{font-size:11px;letter-spacing:.16em;color:var(--pink);white-space:nowrap}
.opts .live b{color:var(--mint)}

.deck{flex:1;overflow:auto;padding:18px 0 6px;display:grid;gap:16px;
  grid-template-columns:repeat(auto-fill,minmax(238px,1fr));align-content:start}
.dcard{
  border:1px solid var(--line-soft);border-left:3px solid var(--c,var(--mint));
  background:var(--surface);padding:12px 13px;display:flex;flex-direction:column;gap:9px;
  transition:border-color .2s,opacity .2s;
}
.dcard:hover{border-color:var(--line)}
.dcard.lead{border-color:var(--pink);background:var(--raise)}
.dcard.blocked{border-color:var(--mars);border-style:dashed}
.dcard.cut{opacity:.32}
.dcard .txt{font-size:13.5px;font-weight:500;line-height:1.4;word-break:break-word}
.dcard img{display:block;width:100%}
.dcard .meta{display:flex;align-items:baseline;gap:8px;font-size:9.5px;letter-spacing:.14em}
.dcard .meta .who{color:var(--c,var(--mint))}
.dcard .meta .cut{margin-left:auto;color:var(--faint);transition:color .2s}
.dcard .meta .cut:hover{color:var(--pink)}
.dcard .src{font-size:10.5px;line-height:1.45;color:var(--dim);border-top:1px solid var(--line-soft);padding-top:6px}
.dcard .ctl{display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  border-top:1px solid var(--line-soft);padding-top:9px;margin-top:auto}
.dcard .ctl button{font-size:10.5px;letter-spacing:.12em;color:var(--faint);
  border:1px solid var(--line-soft);padding:3px 8px;transition:.2s}
.dcard .ctl button:hover{color:var(--pink);border-color:var(--pink)}
.dcard .ctl button.on{background:var(--mint);color:var(--void);border-color:var(--mint)}
.dcard .ctl button.warn.on{background:var(--mars);color:var(--cream);border-color:var(--mars)}
.dcard .ctl .lab{font-size:9.5px;letter-spacing:.16em;color:var(--mint);white-space:nowrap}
.dcard .score{margin-left:auto;font-size:15px;font-weight:800;letter-spacing:-.03em;color:var(--pink)}
.dcard .veil-score{margin-left:auto;font-size:10px;letter-spacing:.16em;color:var(--faint)}
.dcard .crit{display:flex;align-items:center;gap:7px}
.dcard .crit .nm{font-size:10px;letter-spacing:.1em;color:var(--dim);width:74px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dcard .pip{width:13px;height:13px;border:1px solid var(--line);border-radius:50%}
.dcard .pip.on{background:var(--grass);border-color:var(--grass)}
.dcard .note{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line-soft);
  outline:0;font-size:12px;line-height:1.4;color:var(--cream);resize:none;height:44px;padding:4px 0}
.dcard .note:focus{border-bottom-color:var(--pink)}
.dcard .note::placeholder{color:var(--faint)}
.dcard .tallybar{display:flex;gap:3px;flex-wrap:wrap}
.dcard .dot{width:9px;height:9px;border-radius:50%;background:var(--pink)}

/* two axis plane */
.plane-wrap{flex:1;display:flex;gap:14px;padding:18px 0 6px;min-height:0}
.plane{position:relative;flex:1;border:1px solid var(--line);background:rgba(66,173,173,.04);overflow:hidden}
.plane::before,.plane::after{content:"";position:absolute;background:var(--line-soft)}
.plane::before{left:0;right:0;top:50%;height:1px}
.plane::after{top:0;bottom:0;left:50%;width:1px}
.axis{position:absolute;font-size:10px;letter-spacing:.2em;color:var(--mint);z-index:2}
.axis input{background:transparent;border:0;border-bottom:1px solid transparent;outline:0;
  font:inherit;letter-spacing:.2em;color:var(--mint);text-align:center;width:190px;padding:2px}
.axis input:focus{border-bottom-color:var(--pink)}
.axis.n{top:8px;left:50%;transform:translateX(-50%)}
.axis.s{bottom:8px;left:50%;transform:translateX(-50%)}
.axis.w{left:10px;top:50%;transform:translateY(-50%) rotate(-90deg)}
.axis.e{right:10px;top:50%;transform:translateY(-50%) rotate(90deg)}
.pin{
  position:absolute;width:150px;padding:7px 9px;background:var(--raise);
  border:1px solid var(--line-soft);border-left:3px solid var(--c,var(--mint));
  font-size:11.5px;line-height:1.35;touch-action:none;user-select:none;word-break:break-word;
  box-shadow:0 10px 22px rgba(4,20,22,.6);
}
.pin.cut{opacity:.3}
.pin .who{display:block;margin-top:5px;font-size:9px;letter-spacing:.14em;color:var(--c,var(--mint))}
.tostage{width:214px;flex:none;border:1px solid var(--line);background:var(--surface);
  display:flex;flex-direction:column}

/* bracket */
.bracket{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:20px}
.bracket .vs{display:flex;align-items:stretch;gap:22px;flex-wrap:wrap;justify-content:center}
.bracket .fighter{
  width:290px;border:1px solid var(--line);background:var(--surface);padding:20px;
  display:flex;flex-direction:column;gap:12px;transition:border-color .2s,background .2s;
}
.bracket .fighter:hover{border-color:var(--pink);background:var(--raise)}
.bracket .fighter .t{font-size:17px;font-weight:600;line-height:1.35;letter-spacing:-.02em}
.bracket .fighter .w{font-size:9.5px;letter-spacing:.16em;color:var(--c,var(--mint))}
.bracket .fighter img{width:100%;display:block}
.bracket .mid{font-size:11px;letter-spacing:.3em;color:var(--mint);align-self:center}
.bracket .champ{text-align:center}
.bracket .champ .big{font-size:clamp(26px,3.6vw,46px);font-weight:800;letter-spacing:-.05em;color:var(--pink);line-height:1.05}
.bracket .note{font-size:11px;letter-spacing:.2em;color:var(--dim)}

@media (max-width:1000px){
  #decideView{height:auto;padding:18px}
  .plane-wrap{flex-direction:column}
  .plane{min-height:60vh}
}


/* ---------- shared values ---------- */
.values{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:13px 0;border-bottom:1px solid var(--line-soft)}
.values .tag{font-size:10px;letter-spacing:.28em;color:var(--gold);white-space:nowrap}
.values .chip-v{
  display:flex;align-items:center;gap:8px;border:1px solid var(--gold);
  color:var(--gold);font-size:11.5px;font-weight:600;padding:5px 10px;
}
.values .chip-v button{font-size:10px;color:var(--gold);opacity:.6;transition:opacity .2s}
.values .chip-v button:hover{opacity:1}
.values input{
  background:transparent;border:0;border-bottom:1px solid var(--line-soft);outline:0;
  font-size:12.5px;color:var(--cream);padding:5px 0;min-width:230px;transition:border-color .2s;
}
.values input:focus{border-bottom-color:var(--gold)}
.values input::placeholder{color:var(--faint)}
.values .none{font-size:11.5px;color:var(--faint);line-height:1.5}

/* ---------- phase four: the brief ---------- */
#briefView[hidden]{display:none!important}
#briefView{height:calc(100vh - 100px);display:flex;gap:24px;padding:22px 44px 22px 30px;min-height:0}
.digest{width:308px;flex:none;overflow:auto;border:1px solid var(--line);background:var(--surface);padding:16px}
.digest h5{margin:0 0 8px;font-size:10px;letter-spacing:.28em;color:var(--mint);font-weight:600}
.digest section{padding:0 0 16px;margin-bottom:16px;border-bottom:1px solid var(--line-soft)}
.digest section:last-child{border-bottom:0;margin-bottom:0}
.digest .item{font-size:12.5px;line-height:1.45;padding:5px 0 5px 10px;border-left:2px solid var(--c,var(--mint));margin-bottom:5px}
.digest .item small{display:block;font-size:9.5px;letter-spacing:.14em;color:var(--dim);margin-top:3px}
.digest .none{font-size:11.5px;color:var(--faint);line-height:1.5}
.digest .vchip{display:inline-block;border:1px solid var(--gold);color:var(--gold);
  font-size:11px;font-weight:600;padding:3px 8px;margin:0 5px 5px 0}
.digest .spark{font-size:14px;line-height:1.45;color:var(--cream)}

.brief{flex:1;overflow:auto;min-width:0;padding-right:6px}
.brief .lede{font-size:10.5px;letter-spacing:.3em;color:var(--mint);margin-bottom:6px}
.brief h3{font-size:clamp(26px,3.4vw,42px);font-weight:800;letter-spacing:-.05em;margin:0 0 4px;color:var(--pink)}
.brief .sub{font-size:13px;color:var(--dim);line-height:1.5;max-width:62ch;margin-bottom:22px}
.bfield{margin-bottom:24px}
.bfield label{display:flex;align-items:baseline;gap:14px;font-size:10.5px;letter-spacing:.26em;color:var(--mint);margin-bottom:8px}
.bfield label .hint{letter-spacing:0;font-size:11.5px;color:var(--faint);text-transform:none}
.bfield label .pull{margin-left:auto;font-size:10.5px;letter-spacing:.14em;color:var(--gold);white-space:nowrap}
.bfield label .pull:hover{color:var(--pink)}
.bfield textarea,.bfield input[type=text]{
  width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);outline:0;
  color:var(--cream);font-size:15px;font-weight:500;line-height:1.5;padding:7px 0;resize:vertical;
  transition:border-color .2s;
}
.bfield textarea{min-height:62px}
.bfield textarea:focus,.bfield input[type=text]:focus{border-bottom-color:var(--pink)}
.bfield textarea::placeholder,.bfield input::placeholder{color:var(--faint)}
.crit-row{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line-soft);padding:4px 0}
.crit-row .n{font-size:10px;letter-spacing:.14em;color:var(--gold);width:22px;flex:none}
.crit-row input{flex:1;background:transparent;border:0;outline:0;color:var(--cream);
  font-size:15px;font-weight:500;padding:9px 0}
.crit-row .kill{font-size:11px;color:var(--faint)}
.crit-row .kill:hover{color:var(--pink)}
.addrow{margin-top:10px;font-size:11px;letter-spacing:.16em;color:var(--dim)}
.addrow:hover{color:var(--pink)}
.twocol{display:flex;gap:24px;flex-wrap:wrap}
.twocol .bfield{flex:1;min-width:230px}

/* ---------- check in ---------- */
.survey .q{border-top:1px solid var(--line-soft);padding:14px 0}
.survey .q p{margin:0 0 9px;font-size:14.5px;line-height:1.45;color:var(--cream)}
.survey .q .rev{font-size:10px;letter-spacing:.16em;color:var(--faint);margin-left:8px}
.survey .scale{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.survey .scale button{
  width:38px;height:34px;border:1px solid var(--line);color:var(--dim);
  font-size:13px;font-weight:600;transition:.2s;
}
.survey .scale button:hover{border-color:var(--mint);color:var(--mint)}
.survey .scale button.on{background:var(--mint);color:var(--void);border-color:var(--mint)}
.survey .scale .cap{font-size:10px;letter-spacing:.14em;color:var(--faint);margin:0 4px}
.survey .dim{font-size:10px;letter-spacing:.28em;color:var(--gold);margin:22px 0 0}
.survey textarea{
  width:100%;height:74px;background:transparent;border:1px solid var(--line);outline:0;
  color:var(--cream);font-size:14px;line-height:1.45;padding:10px;resize:vertical;margin-top:6px;
}
.survey textarea:focus{border-color:var(--pink)}
.survey .agg{border-top:1px solid var(--line-soft);margin-top:18px;padding-top:14px}
.survey .agg .row{display:flex;align-items:center;gap:12px;padding:5px 0;font-size:12.5px}
.survey .agg .row .nm{width:170px;color:var(--dim);font-size:11px;letter-spacing:.14em}
.survey .agg .bar{flex:1;height:8px;background:var(--line-soft);position:relative}
.survey .agg .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--mint)}
.survey .agg .row b{width:34px;text-align:right;color:var(--pink)}

@media (max-width:1000px){
  #briefView{height:auto;flex-direction:column;padding:18px}
  .digest{width:auto;max-height:none}
}

/* ---------- coming back later ---------- */
.since{
  display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.14em;
  color:var(--gold);border:1px solid var(--gold);padding:5px 10px;white-space:nowrap;
}
.since button{font-size:10px;color:var(--gold);opacity:.65}
.since button:hover{opacity:1}
.fresh{position:relative}
.fresh::after{
  content:"new";position:absolute;top:-8px;right:-6px;background:var(--gold);color:var(--void);
  font-size:8.5px;font-weight:700;letter-spacing:.16em;padding:1px 5px;z-index:3;
}
.card.fresh{box-shadow:0 0 0 1px var(--gold),0 22px 44px rgba(4,20,22,.75)}
.phases button[data-group="1"]::after{
  content:"";display:inline-block;width:5px;height:5px;border-radius:50%;
  background:var(--gold);margin-left:6px;vertical-align:middle;
}
.rejoin{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.rejoin button{
  border:1px solid var(--line);color:var(--cream);font-size:13px;font-weight:600;
  padding:9px 14px;transition:.2s;
}
.rejoin button:hover{border-color:var(--mint);color:var(--mint)}
.rejoin .seen{font-size:10px;letter-spacing:.14em;color:var(--faint);margin-left:8px}

/* ---------- phase five: the check in ---------- */
#checkView[hidden]{display:none!important}
#checkView{height:calc(100vh - 100px);display:flex;gap:26px;padding:22px 44px 22px 30px;min-height:0}
.qform{flex:1;min-width:0;overflow:auto;padding-right:8px}
.qform .lede{font-size:10.5px;letter-spacing:.3em;color:var(--mint);margin-bottom:6px}
.qform h3{font-size:clamp(26px,3.2vw,40px);font-weight:800;letter-spacing:-.05em;margin:0 0 6px;color:var(--pink)}
.qform .sub{font-size:13px;color:var(--dim);line-height:1.55;max-width:60ch;margin-bottom:20px}
.qdim{font-size:10px;letter-spacing:.28em;color:var(--gold);margin:22px 0 4px}
.qrow{border-top:1px solid var(--line-soft);padding:12px 0;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.qrow p{margin:0;flex:1;min-width:260px;font-size:14px;line-height:1.4;color:var(--cream)}
.qrow .rev{font-size:9.5px;letter-spacing:.16em;color:var(--faint);margin-left:8px;white-space:nowrap}
.qscale{display:flex;gap:6px;align-items:center}
.qscale button{width:36px;height:32px;border:1px solid var(--line);color:var(--dim);font-size:13px;font-weight:600;transition:.2s}
.qscale button:hover{border-color:var(--mint);color:var(--mint)}
.qscale button.on{background:var(--mint);color:var(--void);border-color:var(--mint)}
.qscale .cap{font-size:9px;letter-spacing:.14em;color:var(--faint);width:56px}
.qscale .cap.r{text-align:right}
.qopen{margin-top:18px}
.qopen label{display:block;font-size:10.5px;letter-spacing:.26em;color:var(--mint);margin:16px 0 6px}
.qopen textarea{width:100%;height:78px;background:transparent;border:1px solid var(--line);outline:0;
  color:var(--cream);font-size:14px;line-height:1.45;padding:10px;resize:vertical}
.qopen textarea:focus{border-color:var(--pink)}
.qsend{display:flex;align-items:center;gap:18px;margin:22px 0 10px}
.qsend .go{border:1px solid var(--pink);color:var(--pink);font-size:12px;letter-spacing:.24em;
  font-weight:600;padding:14px 34px;transition:.25s}
.qsend .go:hover{background:var(--pink);color:var(--void)}
.qsend .said{font-size:11px;letter-spacing:.14em;color:var(--dim)}

.results{width:430px;flex:none;overflow:auto;border:1px solid var(--line);background:var(--surface);padding:18px}
.results h5{margin:0 0 4px;font-size:10px;letter-spacing:.28em;color:var(--mint);font-weight:600}
.results .n{font-size:11px;letter-spacing:.14em;color:var(--gold);margin-bottom:14px}
.results section{border-top:1px solid var(--line-soft);padding-top:14px;margin-top:16px}
.results .quote{font-size:12px;line-height:1.5;color:#CDE4E5;border-left:2px solid var(--teal);
  padding:4px 0 4px 10px;margin-bottom:9px}
.results .quote span{display:block;font-size:9.5px;letter-spacing:.14em;color:var(--faint);margin-top:3px}
.results .none{font-size:11.5px;color:var(--faint);line-height:1.5}
.chartkey{display:flex;gap:14px;font-size:9.5px;letter-spacing:.12em;color:var(--dim);margin-top:8px}
.chartkey i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}

@media (max-width:1000px){
  #checkView{height:auto;flex-direction:column;padding:18px}
  .results{width:auto}
}
/* ---------- instructor panel ---------- */
.wordmark{cursor:none}
.adminrow{display:flex;align-items:center;gap:12px;border-top:1px solid var(--line-soft);padding:12px 0}
.adminrow .nm{flex:1;font-size:13.5px;color:var(--cream)}
.adminrow .nm small{display:block;font-size:11px;color:var(--dim);margin-top:2px;line-height:1.4}
.adminrow button{font-size:11px;letter-spacing:.14em;color:var(--dim);border:1px solid var(--line);
  padding:7px 12px;transition:.2s;white-space:nowrap}
.adminrow button:hover{border-color:var(--pink);color:var(--pink)}
.adminrow button.danger:hover{border-color:var(--mars);color:var(--mars)}
.checkrow{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.checkrow button{font-size:11px;letter-spacing:.1em;color:var(--dim);border:1px solid var(--line-soft);padding:7px 11px}
.checkrow button[data-on="1"]{background:var(--mint);color:var(--void);border-color:var(--mint)}
.erase{display:flex;align-items:center;gap:12px;margin-top:14px}
.erase input{flex:1;background:transparent;border:0;border-bottom:1px solid var(--mars);outline:0;
  color:var(--cream);font-size:15px;font-weight:600;letter-spacing:.1em;padding:8px 0}
.erase button{border:1px solid var(--mars);color:var(--mars);font-size:11px;letter-spacing:.2em;
  font-weight:600;padding:11px 20px;transition:.2s}
.erase button:hover{background:var(--mars);color:var(--cream)}
.scard .acts button.gone:hover{color:var(--mars)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>

<div id="loader"><div class="mark">riff room<small>yes and, in orbit</small></div></div>
<div id="follower"></div>
<div id="cursor"></div>
<canvas id="starfield"></canvas>
<div id="edge">riff room <b id="edgeStatus">local</b></div>

<div class="topbar">
  <div class="wordmark">riff room<i>.</i></div>
  <div class="prompt">
    <label for="promptInput">spark</label>
    <input id="promptInput" placeholder="the question this group is riffing on">
  </div>
  <div class="since" id="sinceBox" hidden></div>

<div class="board" id="riffView">

  <div class="zone zone-top" id="zoneT"></div>

    <div class="stage" id="stage">
      <svg id="wires"></svg>
      <div class="stage-label" id="stageLabel">group 01</div>
      <button id="unframe" style="position:absolute;top:12px;right:14px;z-index:5;font-size:10px;letter-spacing:.18em;color:var(--dim);border:1px solid var(--line-soft);padding:4px 9px">send it all back</button>
      <div class="empty-note" id="emptyNote">
        <div class="big">send one idea<br>into the frame</div>
        <div class="sub">one person starts, everyone else builds</div>

    </div>
  </div>

  <div class="zone zone-bottom" id="zoneB"></div>

  <div class="sortbar">
    <div class="lede">phase <b>02</b> &nbsp;sort · combine · rank</div>
    <button id="newCol">+ new cluster</button>
    <button id="combineBtn" disabled>combine selected</button>

  </div>

    <div class="pool">
      <div class="pane-head"><span class="tag">loose ideas</span><span class="n" id="poolN"></span></div>
      <div class="pane-body" id="poolBody" data-bucket=""></div>

  <div class="values" id="valuesDecide"></div>
  <div class="methods" id="methods"></div>
  <div class="opts" id="opts"></div>
  <div id="decideBoard" style="flex:1;display:flex;flex-direction:column;min-height:0"></div>
</div>

  <div class="digest" id="digest"></div>
  <div class="brief" id="briefForm"></div>

  <div class="qform" id="qform"></div>
  <div class="results" id="qresults"></div>

<input type="file" id="filePick" accept="image/*" hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ============================================================
   1. SETTINGS
   Paste your Firebase Realtime Database config below to turn on
   live sync between everyone in the class. Leave it as is and the
   board still runs, just on this one screen with no sharing.
   ============================================================ */
const FIREBASE_CONFIG = {
  apiKey: "PASTE_YOUR_API_KEY",
  authDomain: "PASTE.firebaseapp.com",
  databaseURL: "https://PASTE-default-rtdb.firebaseio.com",
  projectId: "PASTE",
  storageBucket: "PASTE.appspot.com",
  messagingSenderId: "PASTE",
  appId: "PASTE"
};
const ROOM = "riffroom-fall2026";   // change per class session to start fresh
let GROUP_COUNT = 8;                // 6, 7 or 8, also switchable in the header

/* ============================================================
   2. STATE
   ============================================================ */
const PALETTE = ["#CF6587","#42ADAD","#D5A830","#0E7177","#AF2123","#FFFFFF","#E38FA8","#7ACBCB"];
const SLOTS = ["L1","R1","T1","B1","L2","R2","T2","B2"];
const pad = n => String(n).padStart(2,"0");

const state = {
  group: 1,
  me: null,
  members: {},
  cards: {},
  prompt: "",
  selected: null,
  phase: 1,
  buckets: {},
  settings: {},
  values: {},
  brief: {},
  checkins: {},
  groupPhase: 1,
  since: 0,
  sel: new Set(),
  live: false
};
let db = null, groupRef = null;

const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3);

/* ============================================================
   3. CONNECTION
   ============================================================ */
function connect(){
  if(String(FIREBASE_CONFIG.apiKey).startsWith("PASTE")) return false;
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.database();
    state.live = true;
    return true;
  }catch(e){ console.warn("Firebase off:", e); return false; }
}

function listen(){
  if(groupRef) groupRef.off();
  if(!state.live){ render(); return; }
  groupRef = db.ref(`${ROOM}/g${state.group}`);
  groupRef.on("value", snap => {
    const v = snap.val() || {};
    state.cards = v.cards || {};
    state.members = v.members || {};
    state.buckets = v.buckets || {};
    state.settings = v.settings || {};
    state.values = v.values || {};
    state.brief = v.brief || {};
    state.checkins = v.checkins || {};
    state.groupPhase = v.phase || 1;
    if(document.activeElement !== $("#promptInput")){
      state.prompt = v.prompt || "";
      $("#promptInput").value = state.prompt;
    }
    render();
  });
}

function saveCard(card){
  state.cards[card.id] = card;
  if(state.live) groupRef.child("cards/"+card.id).set(card);
  else render();
}
function patchCard(id, patch){
  if(!state.cards[id]) return;
  Object.assign(state.cards[id], patch);
  if(state.live) groupRef.child("cards/"+id).update(patch);
  else render();
}
function dropCard(id){
  Object.values(state.cards).forEach(c => { if(c.parentId === id) patchCard(c.id, {parentId:null}); });
  delete state.cards[id];
  if(state.live) groupRef.child("cards/"+id).remove();
  else render();
}
function savePrompt(v){
  state.prompt = v;
  if(state.live) groupRef.child("prompt").set(v);
}

/* ============================================================
   4. JOINING
   ============================================================ */
function openJoin(){
  const veil = document.createElement("div");
  veil.className = "veil";
  let pick = 1;
  veil.innerHTML = `
    <div class="sheet">
      <div class="eyebrow">yes and, in orbit</div>
      <h2>riff room</h2>
      <p>Your group works inside one frame. Everyone takes a station on the walls around it, fills it with rough ideas, and sends one into the middle. From there the group builds outward, one yes and at a time. Come and go as your week allows, the board keeps everything.</p>
      <label>your group</label>
      <div class="grouppick" id="gp"></div>
      <div id="back"></div>
      <label for="nameIn">your artist name</label>
      <input type="text" id="nameIn" placeholder="the name you make work under" autocomplete="off">
      <button class="magnetic" id="joinGo">start riffing</button>
    </div>`;
  document.body.appendChild(veil);
  const gp = veil.querySelector("#gp");
  const back = veil.querySelector("#back");

  const enter = (id, name) => {
    state.me = {id, name};
    state.group = pick;
    veil.remove();
    listen();
    setTimeout(claimSlot, 400);
    $("#whoBadge").hidden = false;
    $("#whoName").textContent = name;
  };

  // anyone already in this group, so a returning artist claims their own name
  // instead of arriving as a stranger with a fresh set of dots
  const showReturners = () => {
    back.innerHTML = "";
    const paintList = members => {
      const list = Object.values(members || {});
      if(!list.length) return;
      const saved = recall(pick);
      const lab = document.createElement("label");
      lab.textContent = saved ? "welcome back" : "already in this group";
      back.appendChild(lab);
      const row = document.createElement("div");
      row.className = "rejoin";
      list.sort((a, b) => (b.seen || b.ts || 0) - (a.seen || a.ts || 0)).forEach(m => {
        const btn = document.createElement("button");
        const ago = m.seen ? timeAgo(m.seen) : "";
        btn.innerHTML = `${esc(m.name)}${ago ? `<span class="seen">${ago}</span>` : ""}`;
        if(saved && saved.id === m.id) btn.style.borderColor = "var(--mint)";
        btn.onclick = () => enter(m.id, m.name);
        row.appendChild(btn);
      });
      back.appendChild(row);
    };
    if(state.live && db){
      db.ref(`${ROOM}/g${pick}/members`).once("value").then(sn => paintList(sn.val()));
    }else if(pick === state.group){
      paintList(state.members);
    }
  };

  const paint = () => {
    gp.innerHTML = "";
    for(let i = 1; i <= GROUP_COUNT; i++){
      const b = document.createElement("button");
      b.textContent = pad(i);
      b.dataset.on = i === pick ? "1" : "0";
      b.onclick = () => { pick = i; paint(); showReturners(); };
      gp.appendChild(b);
    }
  };
  paint();
  showReturners();
  setTimeout(() => veil.querySelector("#nameIn").focus(), 60);
  const go = () => {
    const name = veil.querySelector("#nameIn").value.trim();
    if(!name){ veil.querySelector("#nameIn").focus(); return; }
    enter(uid(), name);
  };
  veil.querySelector("#joinGo").onclick = go;
  veil.querySelector("#nameIn").onkeydown = e => { if(e.key === "Enter") go(); };
  magnetise(veil.querySelector("#joinGo"));
}

function claimSlot(){
  if(!state.me) return;
  remember();
  const mine = Object.values(state.members).find(m => m.id === state.me.id);
  if(mine){
    if(!state.since) state.since = mine.seen || 0;
    applyMe(mine);
    touchSeen();
    render();
    return;
  }
  const taken = new Set(Object.values(state.members).map(m => m.slot));
  const slot = SLOTS.find(s => !taken.has(s)) || "L1";
  const idx = SLOTS.indexOf(slot);
  const rec = {id:state.me.id, name:state.me.name, color:PALETTE[idx % PALETTE.length], slot, ts:Date.now()};
  state.members[rec.id] = rec;
  if(state.live) groupRef.child("members/"+rec.id).set(rec);
  applyMe(rec);
  touchSeen();
  render();
}
function applyMe(rec){
  state.me.color = rec.color;
  state.me.slot = rec.slot;
  $("#whoSwatch").style.background = rec.color;
}

/* ============================================================
   5. MAKING CARDS
   ============================================================ */
function makeCard({text = "", img = null, parentId = null, zone = "tray", x = .5, y = .5}){
  const c = {
    id: uid(),
    text, img,
    type: img ? "image" : "text",
    authorId: state.me.id,
    authorName: state.me.name,
    color: state.me.color || "#42ADAD",
    zone, x, y, parentId,
    rot: Math.round((Math.random()*2.4 - 1.2) * 10) / 10,
    ts: Date.now()
  };
  const onStage = Object.values(state.cards).some(k => k.zone === "stage");
  c.seed = (zone === "stage" && !onStage);
  saveCard(c);
  return c;
}

function pickImage(then){
  const inp = $("#filePick");
  inp.value = "";
  inp.onchange = () => {
    const f = inp.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = () => shrink(r.result, then);
    r.readAsDataURL(f);
  };
  inp.click();
}
function shrink(dataUrl, then){
  const im = new Image();
  im.onload = () => {
    const max = 560;
    const s = Math.min(1, max / Math.max(im.width, im.height));
    const cv = document.createElement("canvas");
    cv.width = Math.round(im.width * s);
    cv.height = Math.round(im.height * s);
    cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
    then(cv.toDataURL("image/jpeg", .74));
  };
  im.onerror = () => then(dataUrl);
  im.src = dataUrl;
}

/* ============================================================
   6. RENDER
   ============================================================ */
function render(){
  renderTabs();
  const p = state.phase;
  $("#riffView").hidden = p !== 1;
  $("#sortView").hidden = p !== 2;
  $("#decideView").hidden = p !== 3;
  $("#briefView").hidden = p !== 4;
  $("#checkView").hidden = p !== 5;
  [...document.querySelectorAll("#phases button")].forEach(b => {
    b.dataset.on = (+b.dataset.p === p) ? "1" : "0";
    b.dataset.group = (+b.dataset.p === (state.groupPhase || 1) && +b.dataset.p !== p) ? "1" : "0";
    b.title = +b.dataset.p === (state.groupPhase || 1) ? "the group has reached this phase" : "";
  });
  renderSince();
  if(p === 2) renderSort();
  else if(p === 3) renderDecide();
  else if(p === 4) renderBrief();
  else if(p === 5) renderCheck();
  else { renderTrays(); renderStage(); }
  $("#stageLabel").textContent = "group " + pad(state.group);
  $("#edgeStatus").textContent = (state.live ? "live" : "local") + " · phase " + pad(state.phase);
}

function renderTabs(){
  const t = $("#tabs");
  t.innerHTML = "";
  for(let i=1;i<=GROUP_COUNT;i++){
    const b = document.createElement("button");
    b.className = "tab";
    b.textContent = "group " + pad(i);
    b.dataset.active = i === state.group ? "1" : "0";
    b.onclick = () => {
      state.group = i;
      state.selected = null;
      closeComposer();
      state.sel.clear();
      if(!state.live){ state.cards = {}; state.members = {}; state.buckets = {}; state.settings = {}; state.values = {}; state.brief = {}; state.checkins = {}; state.phase = 1; }
      listen();
      setTimeout(claimSlot, 300);
      render();
    };
    t.appendChild(b);
  }
  const sp = document.createElement("div"); sp.className = "spacer"; t.appendChild(sp);
  const sel = document.createElement("select");
  [6,7,8].forEach(n => {
    const o = document.createElement("option");
    o.value = n; o.textContent = n + " groups"; o.selected = n === GROUP_COUNT;
    sel.appendChild(o);
  });
  sel.onchange = () => { GROUP_COUNT = +sel.value; if(state.group > GROUP_COUNT) state.group = 1; render(); };
  t.appendChild(sel);
}

function renderTrays(){
  const zones = {L:$("#zoneL"), R:$("#zoneR"), T:$("#zoneT"), B:$("#zoneB")};
  Object.values(zones).forEach(z => z.innerHTML = "");
  const bySlot = {};
  Object.values(state.members).forEach(m => bySlot[m.slot] = m);

  SLOTS.forEach((slot, i) => {
    const m = bySlot[slot];
    const zone = zones[slot[0]];
    const tray = document.createElement("div");
    tray.className = "tray in";
    tray.dataset.slot = slot;
    if(!m){
      tray.dataset.empty = "1";
      tray.innerHTML = `<div class="tray-head"><span class="num">${pad(i+1)}</span><span class="nm" style="color:#48757A">open station</span></div>
        <div class="tray-hint">Anyone else in the group can take this wall.</div>`;
      zone.appendChild(tray);
      return;
    }
    const mine = state.me && m.id === state.me.id;
    tray.dataset.mine = mine ? "1" : "0";
    tray.dataset.owner = m.id;

    const cards = Object.values(state.cards)
      .filter(c => c.zone === "tray" && c.authorId === m.id)
      .sort((a,b) => a.ts - b.ts);

    const head = document.createElement("div");
    head.className = "tray-head";
    head.innerHTML = `<span class="num" style="color:${m.color}">${pad(i+1)}</span>
      <span class="nm">${esc(m.name)}</span>
      <span class="count">${pad(cards.length)}</span>`;
    tray.appendChild(head);

    const body = document.createElement("div");
    body.className = "tray-body";
    cards.forEach(c => body.appendChild(chipEl(c, mine)));
    if(!cards.length && !mine) body.innerHTML = `<div class="tray-hint">Nothing parked here yet.</div>`;
    tray.appendChild(body);

    if(mine){
      const foot = document.createElement("div");
      foot.className = "tray-foot";
      const inp = document.createElement("input");
      inp.placeholder = "new idea, then enter";
      inp.onkeydown = e => {
        if(e.key === "Enter" && inp.value.trim()){
          makeCard({text: inp.value.trim()});
          inp.value = "";
          setTimeout(() => { const f = document.querySelector('.tray[data-mine="1"] .tray-foot input'); if(f) f.focus(); }, 30);
        }
      };
      const ib = document.createElement("button");
      ib.className = "mini"; ib.textContent = "image";
      ib.onclick = () => pickImage(d => makeCard({img: d, text: ""}));
      foot.appendChild(inp); foot.appendChild(ib);
      tray.appendChild(foot);
    }
    zone.appendChild(tray);
  });
}

function chipEl(c, mine){
  const el = document.createElement("div");
  el.className = "chip" + (isFresh(c) ? " fresh" : "");
  el.style.setProperty("--c", c.color);
  el.dataset.id = c.id;
  el.innerHTML = (mine ? `<span class="x" title="delete">✕</span>` : "") +
    (c.img ? `<img src="${c.img}" alt="">` : "") +
    `<span>${esc(c.text)}</span>`;
  if(mine){
    el.querySelector(".x").onclick = e => { e.stopPropagation(); dropCard(c.id); };
    drag(el, c);
  }
  return el;
}

function renderStage(){
  const stage = $("#stage");
  [...stage.querySelectorAll(".card")].forEach(n => n.remove());
  const cards = Object.values(state.cards).filter(c => c.zone === "stage");
  $("#emptyNote").style.display = cards.length ? "none" : "flex";

  const r = stage.getBoundingClientRect();
  cards.sort((a,b) => a.ts - b.ts).forEach(c => {
    const el = document.createElement("div");
    el.className = "card" + (isFresh(c) ? " fresh" : "") + (c.seed ? " seed" : "") + (c.parentId ? " riff" : "") +
      (c.type === "image" ? " img-card" : "") + (state.selected === c.id ? " sel" : "");
    el.style.setProperty("--c", c.color);
    el.style.setProperty("--rot", c.rot + "deg");
    el.style.left = Math.round(c.x * r.width) + "px";
    el.style.top = Math.round(c.y * r.height) + "px";
    el.dataset.id = c.id;
    el.innerHTML =
      (c.img ? `<img src="${c.img}" alt="">` : "") +
      (c.text ? `<div>${esc(c.text)}</div>` : "") +
      `<span class="by">${esc(c.authorName)}</span>`;

    const acts = document.createElement("div");
    acts.className = "acts";
    const yes = document.createElement("button");
    yes.textContent = "yes, and";
    yes.onclick = e => { e.stopPropagation(); openComposer(c, el); };
    acts.appendChild(yes);
    if(state.me && c.authorId === state.me.id){
      const del = document.createElement("button");
      del.textContent = "remove";
      del.onclick = e => { e.stopPropagation(); dropCard(c.id); };
      acts.appendChild(del);
    }
    el.appendChild(acts);

    el.onclick = () => { state.selected = state.selected === c.id ? null : c.id; render(); };
    drag(el, c);
    stage.appendChild(el);
  });
  drawWires();
}

function drawWires(){
  const stage = $("#stage"), svg = $("#wires");
  const r = stage.getBoundingClientRect();
  svg.setAttribute("viewBox", `0 0 ${r.width} ${r.height}`);
  svg.innerHTML = "";
  Object.values(state.cards).forEach(c => {
    if(c.zone !== "stage" || !c.parentId) return;
    const p = state.cards[c.parentId];
    if(!p || p.zone !== "stage") return;
    const a = center(p, r), b = center(c, r);
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2 - 30;
    const path = document.createElementNS("http://www.w3.org/2000/svg","path");
    path.setAttribute("d", `M ${a.x} ${a.y} Q ${mx} ${my} ${b.x} ${b.y}`);
    path.setAttribute("fill","none");
    path.setAttribute("stroke", c.color);
    path.setAttribute("stroke-width","1");
    path.setAttribute("opacity",".85");
    svg.appendChild(path);
    const dot = document.createElementNS("http://www.w3.org/2000/svg","circle");
    dot.setAttribute("cx", b.x); dot.setAttribute("cy", b.y);
    dot.setAttribute("r","2.5"); dot.setAttribute("fill", c.color);
    svg.appendChild(dot);
  });
}
function center(c, r){
  const w = c.type === "image" ? 224 : 196;
  const el = document.querySelector(`.card[data-id="${c.id}"]`);
  const h = el ? el.offsetHeight : 90;
  return {x: c.x * r.width + w / 2, y: c.y * r.height + h / 2};
}

/* ============================================================
   7. DRAGGING
   ============================================================ */
function drag(el, card){
  el.addEventListener("pointerdown", e => {
    if(e.target.closest("button") || e.target.classList.contains("x")) return;
    e.preventDefault();
    const box = el.getBoundingClientRect();
    const offX = e.clientX - box.left, offY = e.clientY - box.top;
    $("#follower").classList.add("grab");

    const ghost = el.cloneNode(true);
    ghost.classList.add("ghost");
    ghost.style.width = box.width + "px";
    ghost.style.left = box.left + "px";
    ghost.style.top = box.top + "px";
    ghost.style.position = "fixed";
    document.body.appendChild(ghost);
    el.style.opacity = ".2";
    let over = null;

    const move = ev => {
      ghost.style.left = (ev.clientX - offX) + "px";
      ghost.style.top = (ev.clientY - offY) + "px";
      const under = document.elementFromPoint(ev.clientX, ev.clientY);
      const hitCard = under && under.closest(".card");
      $("#stage").classList.toggle("hot", !!(under && under.closest(".stage")));
      const t = (hitCard && hitCard.dataset.id !== card.id) ? hitCard : null;
      if(over !== t){
        if(over) over.classList.remove("drop-target");
        over = t;
        if(over) over.classList.add("drop-target");
      }
    };
    const up = ev => {
      document.removeEventListener("pointermove", move);
      document.removeEventListener("pointerup", up);
      ghost.remove();
      el.style.opacity = "";
      $("#follower").classList.remove("grab");
      $("#stage").classList.remove("hot");
      if(over) over.classList.remove("drop-target");

      const under = document.elementFromPoint(ev.clientX, ev.clientY);
      const sr = $("#stage").getBoundingClientRect();
      const onStage = ev.clientX > sr.left && ev.clientX < sr.right && ev.clientY > sr.top && ev.clientY < sr.bottom;
      const myTray = under && under.closest('.tray[data-mine="1"]');

      if(myTray && state.me && card.authorId === state.me.id){
        patchCard(card.id, {zone:"tray", parentId:null, seed:false});
      }else if(onStage){
        const w = card.type === "image" ? 224 : 196;
        const x = clamp((ev.clientX - offX - sr.left) / sr.width, 0, 1 - w / sr.width);
        const y = clamp((ev.clientY - offY - sr.top) / sr.height, 0, .92);
        const anyStage = Object.values(state.cards).some(k => k.zone === "stage" && k.id !== card.id);
        const patch = {zone:"stage", x, y, seed: !anyStage};
        if(over && over.dataset.id !== card.id) patch.parentId = over.dataset.id;
        patchCard(card.id, patch);
      }
      render();
    };
    document.addEventListener("pointermove", move);
    document.addEventListener("pointerup", up);
  });
}

   ============================================================ */
(function cursor(){
  if(window.matchMedia("(max-width:1000px)").matches) return;
  const dot = $("#cursor"), ring = $("#follower");
  let x = innerWidth/2, y = innerHeight/2, fx = x, fy = y;
  addEventListener("pointermove", e => {
    x = e.clientX; y = e.clientY;
    dot.style.transform = `translate(${x}px,${y}px) translate(-50%,-50%)`;
    const t = e.target;
    ring.classList.toggle("big", !!(t.closest("button") || t.closest("a") || t.closest("input") || t.closest("textarea")));
  });
  (function loop(){
    fx += (x - fx) * .16; fy += (y - fy) * .16;
    ring.style.transform = `translate(${fx}px,${fy}px) translate(-50%,-50%)`;
    requestAnimationFrame(loop);
  })();
})();

function magnetise(el){
  if(window.matchMedia("(max-width:1000px)").matches) return;
  const strength = 26;
  el.addEventListener("pointermove", e => {
    const r = el.getBoundingClientRect();
    const dx = (e.clientX - (r.left + r.width/2)) / (r.width/2);
    const dy = (e.clientY - (r.top + r.height/2)) / (r.height/2);
    el.style.transform = `translate(${dx*strength}px, ${dy*strength*.5}px)`;
  });
  el.addEventListener("pointerleave", () => el.style.transform = "");
}

(function starfield(){
  const cv = $("#starfield"), ctx = cv.getContext("2d");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W, H, stars = [], mx = 0, my = 0, tx = 0, ty = 0;
  function build(){
    W = cv.width = innerWidth; H = cv.height = innerHeight;
    const n = Math.round(W * H / 9000);
    stars = Array.from({length:n}, () => {
      const d = Math.random();
      return {x:Math.random()*W, y:Math.random()*H, r:.3 + d*1.1, d,
              a:.12 + Math.random()*.45, vy:.008 + d*.05};
    });
  }
  function frame(){
    ctx.clearRect(0,0,W,H);
    tx += (mx - tx) * .05; ty += (my - ty) * .05;
    ctx.fillStyle = "#FFFFFF";
    for(const s of stars){
      if(!still){ s.y += s.vy; if(s.y > H+2){ s.y = -2; s.x = Math.random()*W; } }
      ctx.globalAlpha = s.a;
      ctx.beginPath();
      ctx.arc(s.x + tx*(4 + s.d*22), s.y + ty*(4 + s.d*22), s.r, 0, 6.283);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    if(!still) requestAnimationFrame(frame);
  }
  addEventListener("resize", () => { build(); if(still) frame(); });
  addEventListener("pointermove", e => {
    mx = (e.clientX / innerWidth - .5) * 2;
    my = (e.clientY / innerHeight - .5) * 2;
  });
  build(); frame();
})();

function setPhase(n){
  state.phase = n;
  state.sel.clear();
  closeComposer();
  // the shared marker only moves forward, so nobody gets yanked out of
  // a phase they are still working in
  if(state.live && n > (state.groupPhase || 1)) groupRef.child("phase").set(n);
  render();
}

function saveBucket(b){
  state.buckets[b.id] = b;
  if(state.live) groupRef.child("buckets/"+b.id).set(b);
  else render();
}
function patchBucket(id, patch){
  if(!state.buckets[id]) return;
  Object.assign(state.buckets[id], patch);
  if(state.live) groupRef.child("buckets/"+id).update(patch);
  else render();
}
function killBucket(id){
  Object.values(state.cards).forEach(c => { if(c.bucket === id) patchCard(c.id, {bucket:null}); });
  delete state.buckets[id];
  if(state.live) groupRef.child("buckets/"+id).remove();
  else render();
}
function patchMany(map){
  Object.entries(map).forEach(([path, val]) => {
    const [id, key] = path.split("/");
    if(state.cards[id]) state.cards[id][key] = val;
  });
  if(state.live){
    const out = {};
    Object.entries(map).forEach(([p, v]) => out["cards/" + p] = v);
    groupRef.update(out);
  }else render();
}

const inBucket = id => Object.values(state.cards)
  .filter(c => c.zone === "stage" && (c.bucket || null) === id)
  .sort((a,b) => (a.order ?? 0) - (b.order ?? 0) || a.ts - b.ts);

function renderSort(){
  renderValues($("#valuesSort"));

  const list = Object.values(state.buckets).sort((a,b) => (a.order ?? 0) - (b.order ?? 0));
  if(!list.length){
    const hint = document.createElement("div");
    hint.className = "col";
    hint.innerHTML = `<div class="pane-head"><span class="tag">no clusters yet</span></div>
      <div class="pane-empty" style="padding:16px">Make a cluster for each idea the group keeps circling back to, then drag the loose ideas into it. Rank inside a cluster by dragging the strongest to the top.</div>`;
    cols.appendChild(hint);

  list.forEach(b => {

    kill.className = "kill"; kill.textContent = "✕"; kill.title = "remove cluster, ideas go back to the pool";
    kill.onclick = () => killBucket(b.id);
    head.append(nm, n, kill);
    col.appendChild(head);
    const body = document.createElement("div");
    body.className = "pane-body";
    body.dataset.bucket = b.id;
    if(!cards.length) body.innerHTML = `<div class="pane-empty">Drag ideas here.</div>`;
    cards.forEach((c, i) => body.appendChild(sortCardEl(c, i, true)));
    dropZone(body, b.id);

  const n = state.sel.size;

function sortCardEl(c, i, ranked){
  const el = document.createElement("div");
  el.className = "scard" + (isFresh(c) ? " fresh" : "") + (state.sel.has(c.id) ? " picked" : "") +
    (c.star ? " starred" : "") + (c.overlap ? " overlap" : "");
  el.style.setProperty("--c", c.color);
  el.dataset.id = c.id;
  el.innerHTML =
    `<div class="top">${ranked ? `<span class="rank">${pad(i+1)}</span>` : ""}
      <span class="who">${esc(c.authorName)}</span></div>` +
    (c.img ? `<img src="${c.img}" alt="">` : "") +
    `<div class="txt">${esc(c.text)}</div>` +
    (c.combined ? `<div class="src">${c.combined.map(s => `<div>${esc(s)}</div>`).join("")}</div>` : "") +
    ((c.star || c.overlap) ? `<div class="flags">
        ${c.star ? `<span class="flag">picked</span>` : ""}
        ${c.overlap ? `<span class="flag ov">overlap</span>` : ""}</div>` : "");

  const acts = document.createElement("div");
  acts.className = "acts";
  if(c.bucket){
    const out = document.createElement("button");
    out.textContent = "unsort";
    out.title = "back to the loose ideas";
    out.onclick = e => { e.stopPropagation(); patchCard(c.id, {bucket: null}); renderSort(); };
    acts.appendChild(out);
  }
  if(state.me && c.authorId === state.me.id){
    const del = document.createElement("button");
    del.className = "gone"; del.textContent = "delete";
    del.title = "remove this idea for good";
    del.onclick = e => { e.stopPropagation(); state.sel.delete(c.id); dropCard(c.id); renderSort(); };
    acts.appendChild(del);
  }
  const star = document.createElement("button");
  star.textContent = "pick"; star.className = c.star ? "on" : "";
  star.onclick = e => { e.stopPropagation(); patchCard(c.id, {star: !c.star}); renderSort(); };
  const ov = document.createElement("button");
  ov.textContent = "overlap"; ov.className = c.overlap ? "on" : "";
  ov.onclick = e => { e.stopPropagation(); patchCard(c.id, {overlap: !c.overlap}); renderSort(); };
  acts.append(star, ov);
  el.appendChild(acts);

  el.onclick = () => {
    state.sel.has(c.id) ? state.sel.delete(c.id) : state.sel.add(c.id);
    renderSort();
  };
  dragSort(el, c);
  return el;
}

function dropZone(el, bucketId){ el.dataset.bucket = bucketId == null ? "" : bucketId; }

function dragSort(el, card){
  el.addEventListener("pointerdown", e => {
    if(e.target.closest("button")) return;
    e.preventDefault();
    const box = el.getBoundingClientRect();
    const offX = e.clientX - box.left, offY = e.clientY - box.top;
    const ghost = el.cloneNode(true);
    ghost.classList.add("ghost");
    ghost.style.cssText += `position:fixed;width:${box.width}px;left:${box.left}px;top:${box.top}px`;
    document.body.appendChild(ghost);
    el.style.opacity = ".2";
    $("#follower").classList.add("grab");
    let zone = null, moved = false;

    const move = ev => {
      moved = moved || Math.abs(ev.clientX - e.clientX) + Math.abs(ev.clientY - e.clientY) > 4;
      ghost.style.left = (ev.clientX - offX) + "px";
      ghost.style.top = (ev.clientY - offY) + "px";
      const under = document.elementFromPoint(ev.clientX, ev.clientY);
      const z = under && under.closest(".pane-body");
      if(zone !== z){
        if(zone) zone.classList.remove("drop");
        zone = z;
        if(zone) zone.classList.add("drop");
      }
    };
    const up = ev => {
      document.removeEventListener("pointermove", move);
      document.removeEventListener("pointerup", up);
      ghost.remove();
      el.style.opacity = "";
      $("#follower").classList.remove("grab");
      if(zone) zone.classList.remove("drop");
      if(!moved || !zone){ renderSort(); return; }

      const bucket = zone.dataset.bucket || null;
      const sibs = [...zone.querySelectorAll(".scard")].filter(n => n.dataset.id !== card.id);
      let index = sibs.length;
      for(let i = 0; i < sibs.length; i++){
        const r = sibs[i].getBoundingClientRect();
        if(ev.clientY < r.top + r.height / 2){ index = i; break; }
      }
      const ids = sibs.map(n => n.dataset.id);
      ids.splice(index, 0, card.id);
      const map = {};
      ids.forEach((id, i) => { map[id + "/order"] = i; });
      map[card.id + "/bucket"] = bucket;
      patchMany(map);
      renderSort();
    };
    document.addEventListener("pointermove", move);
    document.addEventListener("pointerup", up);
  });
}

function combineSelected(){

/* ---------- values the group decides by ---------- */
const valueList = () => Object.values(state.values || {}).sort((a,b) => (a.order ?? 0) - (b.order ?? 0));
function saveValue(text){

  state.values[v.id] = v;
  if(state.live) groupRef.child("values/" + v.id).set(v);
  else render();

function killValue(id){

  if(state.live) groupRef.child("values/" + id).remove();

}
function renderValues(host){
  if(!host) return;
  host.innerHTML = "";
  const tag = document.createElement("span");
  tag.className = "tag";
  tag.textContent = "we are judging by";
  host.appendChild(tag);
  const list = valueList();
  if(!list.length){
    const n = document.createElement("span");
    n.className = "none";

    host.appendChild(n);
  }
  list.forEach(v => {
    const c = document.createElement("span");
    c.className = "chip-v";
    c.textContent = v.text;
    const x = document.createElement("button");
    x.textContent = "\u2715";
    x.onclick = () => killValue(v.id);
    c.appendChild(x);
    host.appendChild(c);
  });
  const inp = document.createElement("input");
  inp.placeholder = list.length ? "add another value" : "care over speed, make it weird, it has to travel";
  inp.onkeydown = e => {
    if(e.key === "Enter" && inp.value.trim()){
      saveValue(inp.value.trim());
      inp.value = "";
      setTimeout(() => { const f = host.querySelector("input"); if(f) f.focus(); }, 30);
    }
  };
  host.appendChild(inp);
}
const valuesLine = () => valueList().length
  ? "judging by: " + valueList().map(v => v.text).join(" \u00b7 ")

function toast(msg){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("up");
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove("up"), 2200);
}

function riffText(){
  const cards = Object.values(state.cards).filter(c => c.zone === "stage");
  const kids = p => cards.filter(c => c.parentId === p).sort((a,b) => a.ts - b.ts);
  const line = (c, d) => "  ".repeat(d) + (d ? "yes, and " : "") + (c.text || "[image]") +
    "  (" + c.authorName + ")\n" + kids(c.id).map(k => line(k, d + 1)).join("");
  const roots = cards.filter(c => !c.parentId || !state.cards[c.parentId]);
  return `RIFF ROOM — group ${pad(state.group)}\nspark: ${state.prompt || "none recorded"}\n` +
    `${pad(cards.length)} ideas in the frame\n\n` + roots.map(c => line(c, 0)).join("\n");
}
function sortText(){
  const chunk = (title, cards) => title + "\n" +
    (cards.length ? cards.map((c, i) => `  ${pad(i+1)}. ${c.text || "[image]"}` +
      `${c.star ? "  [picked]" : ""}${c.overlap ? "  [overlap]" : ""}  (${c.authorName})` +
      (c.combined ? "\n" + c.combined.map(s => "      from: " + s).join("\n") : "")).join("\n")
      : "  (empty)") + "\n";
  const list = Object.values(state.buckets).sort((a,b) => (a.order ?? 0) - (b.order ?? 0));
  return `RIFF ROOM — group ${pad(state.group)} — sorted\nspark: ${state.prompt || "none recorded"}\n${valuesLine()}\n\n` +
    list.map(b => chunk((b.name || "untitled cluster").toUpperCase(), inBucket(b.id))).join("\n") +
    "\n" + chunk("LOOSE IDEAS", inBucket(null));
}
async function copyResults(){

}
